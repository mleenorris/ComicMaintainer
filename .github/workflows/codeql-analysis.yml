name: "CodeQL Advanced Security Scanning"

on:
  push:
    branches: [ dotnet ]
  pull_request:
    branches: [ dotnet ]
  schedule:
    # Run CodeQL analysis weekly on Wednesday at 3:00 AM UTC
    - cron: '0 3 * * 3'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Determine which languages to analyze based on branch
  analyze-dotnet:
    name: CodeQL Analysis (C#/.NET)
    # Run on dotnet branch for any event type (push, PR, schedule, manual)
    if: |
      github.ref_name == 'dotnet' || 
      github.base_ref == 'dotnet' ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/dotnet') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dotnet')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # 'actions' scans the workflow files themselves (formerly a separate codeql.yml workflow).
        language: [ 'csharp', 'javascript', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
        config: |
          paths-ignore:
            - '**/node_modules'
            - '**/wwwroot/lib'
            - '**/bin'
            - '**/obj'
            - '**/coveragereport'
            - '**/*.min.js'
            - '**/*.min.css'
          # ArchiveEntryReader reads SharpCompress internals through [UnsafeAccessor] methods. They are
          # managed code, but they are declared extern, so these two rules report every one of them as
          # native code. scripts/dev.ps1 uses the same configuration.
          query-filters:
            - exclude:
                id: cs/unmanaged-code
            - exclude:
                id: cs/call-to-unmanaged-code

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies (excluding MAUI)
      if: matrix.language == 'csharp'
      run: |
        dotnet restore src/ComicMaintainer.Core/ComicMaintainer.Core.csproj
        dotnet restore src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
        dotnet restore tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj

    - name: Build .NET projects (excluding MAUI)
      if: matrix.language == 'csharp'
      run: |
        dotnet build src/ComicMaintainer.Core/ComicMaintainer.Core.csproj --no-restore --configuration Release
        dotnet build src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj --no-restore --configuration Release
        dotnet build tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj --no-restore --configuration Release
      timeout-minutes: 15

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        # Uploaded by the steps below, once results in generated code have been removed.
        upload: never
        output: sarif-results
      timeout-minutes: 30

    - name: Remove results in generated code
      # paths-ignore does not apply to compiled languages, so the source generators' output
      # that the build writes under obj/ (the regex and OpenAPI generators) is analyzed too,
      # producing alerts that cannot be fixed in this repository.
      run: |
        python3 - <<'EOF'
        import glob
        import json
        import re

        generated = re.compile(r"(^|/)obj/")
        for path in glob.glob("sarif-results/*.sarif"):
            with open(path, encoding="utf-8") as file:
                sarif = json.load(file)
            for run in sarif.get("runs", []):
                results = run.get("results", [])
                kept = [
                    result for result in results
                    if not generated.search(
                        (result.get("locations") or [{}])[0]
                        .get("physicalLocation", {})
                        .get("artifactLocation", {})
                        .get("uri", ""))
                ]
                run["results"] = kept
                print(f"{path}: removed {len(results) - len(kept)} result(s) in generated code")
            with open(path, "w", encoding="utf-8") as file:
                json.dump(sarif, file)
        EOF

    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: sarif-results
        category: "/language:${{matrix.language}}"
        wait-for-processing: true

    - name: Generate analysis summary
      if: always()
      run: |
        echo "# CodeQL Analysis Summary - ${{ matrix.language }}" > codeql-summary-${{ matrix.language }}.md
        echo "" >> codeql-summary-${{ matrix.language }}.md
        echo "**Analysis Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> codeql-summary-${{ matrix.language }}.md
        echo "**Language:** ${{ matrix.language }}" >> codeql-summary-${{ matrix.language }}.md
        echo "**Branch:** ${{ github.ref_name }}" >> codeql-summary-${{ matrix.language }}.md
        echo "**Query Suite:** security-and-quality (extended)" >> codeql-summary-${{ matrix.language }}.md
        echo "" >> codeql-summary-${{ matrix.language }}.md
        echo "CodeQL analysis completed successfully." >> codeql-summary-${{ matrix.language }}.md

    - name: Upload analysis summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codeql-summary-dotnet-${{ matrix.language }}
        path: codeql-summary-${{ matrix.language }}.md
        retention-days: 90
