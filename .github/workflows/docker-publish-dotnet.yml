name: Build and Push .NET Docker Image

on:
  # Publish only after the version bump for a merge has finished. Building on the push itself
  # used the merge commit, which still carries the previous version, and the bump commit cannot
  # start a build of its own because it is pushed with GITHUB_TOKEN. The published image was
  # therefore always one version behind the newest release. A workflow_run build checks out the
  # newest commit on the default branch (dotnet), which already contains the bump. It runs
  # whatever the bump's outcome, so a merge whose bump was skipped is still published.
  workflow_run:
    workflows: ["Automatic Version Bump"]
    types: [completed]
    branches:
      - dotnet
  pull_request:
    branches: 
      - dotnet
  # Republishes the selected branch (run it on dotnet), e.g. after a failed push to Docker Hub.
  workflow_dispatch:

permissions:
  contents: read

# Publishing runs share one group, and a newer run cancels an older one that is still in
# progress, so a stale build can never finish last and overwrite the :dotnet tag. Pull request
# builds never push, so each one gets a group of its own and is left alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || 'publish' }}
  cancel-in-progress: true

jobs:
  build-and-push-dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Get version from .NET project
        id: get_version
        run: |
          # Extract version from ComicMaintainer.WebApi.csproj
          VERSION=$(grep -oP '<Version>\K[^<]+' src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj || echo "1.0.0")
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Determine Docker tags
        id: docker_tags
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Building from branch: $BRANCH_NAME"
          
          # Use the same image repository as Python version, but with dotnet tag
          IMAGE_BASE="iceburn1/comicmaintainer"
          
          # For dotnet branch, tag as dotnet
          TAGS="${IMAGE_BASE}:dotnet"
          
          # Output tags in a format that can be used by docker/build-push-action
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        
      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-dotnet
          key: ${{ runner.os }}-buildx-dotnet-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-dotnet-
      
      # Registers QEMU so the runner can execute arm64 binaries. Required because the final
      # image stage installs system packages with apt-get, which runs under the target
      # architecture; without this the arm64 build fails with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push .NET Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dotnet
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache-dotnet
          cache-to: type=local,dest=/tmp/.buildx-cache-dotnet
          # arm64 covers Apple Silicon and common NAS/SBC hosts. The build stage compiles
          # natively for the runner and cross-targets, so this does not require emulation.
          platforms: linux/amd64,linux/arm64
          
      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Image pushed with tags ${{ steps.docker_tags.outputs.tags }}"
