version: '3.8'

services:
  comicmaintainer-dotnet:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
    container_name: comicmaintainer-dotnet
    ports:
      - "5000:5000"
    environment:
      - WATCHED_DIR=/watched_dir
      - DUPLICATE_DIR=/duplicates
      - CONFIG_DIR=/Config
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - MAX_WORKERS=4
      - DB_CACHE_SIZE_MB=64
      - JWT_SECRET=${JWT_SECRET:-ChangeThisToASecureRandomString-MustBeAtLeast32CharactersLong!!}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@comicmaintainer.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5000,https://localhost:5000}
      # Optional: enable the Suwayomi sidecar metadata provider (see service block below).
      # - ENABLE_SUWAYOMI_METADATA=true
      # - SUWAYOMI_BASE_URL=http://suwayomi:4567
      # - SUWAYOMI_SOURCE_IDS=  # comma-separated numeric source IDs; leave blank to query all installed sources
      # - SUWAYOMI_USERNAME=    # only required if the Suwayomi sidecar has Basic auth enabled
      # - SUWAYOMI_PASSWORD=
    volumes:
      - ./test_comics:/watched_dir
      - ./duplicates:/duplicates
      - ./config:/Config
    restart: unless-stopped
    networks:
      - comicmaintainer

  # Optional: Suwayomi-Server sidecar for series-name metadata enrichment.
  #
  # Suwayomi (https://github.com/Suwayomi/Suwayomi-Server) is a Tachiyomi/Mihon-derived
  # server that loads community-maintained source extensions (MangaDex, Comick,
  # Bato, Weebcentral, MangaPlus, etc.) and exposes them via a single GraphQL API.
  # When enabled (ENABLE_SUWAYOMI_METADATA=true on the comicmaintainer-dotnet
  # service), ComicMaintainer will use it as an additional metadata provider
  # alongside ComicVine and MangaDex.
  #
  # After first start, open http://localhost:4567 to install the source
  # extensions you want, then take note of their numeric source IDs and pass
  # them via SUWAYOMI_SOURCE_IDS (comma-separated). Leave SUWAYOMI_SOURCE_IDS
  # empty to query every installed source (slower / noisier).
  #
  # Uncomment the block below to enable.
  # suwayomi:
  #   image: ghcr.io/suwayomi/suwayomi-server:stable
  #   container_name: suwayomi
  #   ports:
  #     - "4567:4567"
  #   volumes:
  #     - ./suwayomi:/home/suwayomi/.local/share/Tachidesk
  #   restart: unless-stopped
  #   networks:
  #     - comicmaintainer

networks:
  comicmaintainer:
    driver: bridge
