version: '3.8'

services:
  comicmaintainer-dotnet:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
    container_name: comicmaintainer-dotnet
    ports:
      - "5000:5000"
    environment:
      - WATCHED_DIR=/watched_dir
      - DUPLICATE_DIR=/duplicates
      - CONFIG_DIR=/Config
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - MAX_WORKERS=4
      - DB_CACHE_SIZE_MB=64
      - JWT_SECRET=${JWT_SECRET:-ChangeThisToASecureRandomString-MustBeAtLeast32CharactersLong!!}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@comicmaintainer.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5000,https://localhost:5000}
      # Optional operational features (see README "Monitoring, backups & API docs"):
      # - TELEMETRY__PROMETHEUSENABLED=true          # expose Prometheus metrics at /metrics
      # - TELEMETRY__METRICSTOKEN=change-me          # require "Authorization: Bearer <token>" on /metrics
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317  # push metrics + traces via OTLP
      # - API__ENABLESWAGGER=true                    # serve Swagger UI at /swagger outside Development
      # Import Suwayomi downloads (see .env.example); pair with the volume below:
      # - SUWAYOMI_DOWNLOADS_DIR=/suwayomi/downloads/mangas
    volumes:
      - ./test_comics:/watched_dir
      - ./duplicates:/duplicates
      - ./config:/Config
      # Suwayomi's data folder, outside the watched directory and writable by PUID/PGID:
      # - ./suwayomi:/suwayomi
    restart: unless-stopped
    # --- Container hardening --------------------------------------------------
    # The entrypoint starts as root to create the PUID/PGID user (groupadd/groupmod/
    # useradd/usermod), fix ownership of the mounted volumes (chown/chmod) and then
    # drops to that user with gosu. no-new-privileges is compatible with this:
    # gosu only *drops* privileges and is not a setuid binary.
    security_opt:
      - no-new-privileges:true
    # Drop every capability, then add back only what the entrypoint needs:
    #   CHOWN        - chown -R the volumes to PUID:PGID
    #   FOWNER       - chmod files/dirs the root user does not own (host-owned volumes)
    #   DAC_OVERRIDE - traverse/modify volumes whose host permissions exclude root,
    #                  and edit /etc/passwd, /etc/group, /etc/shadow
    #   SETUID/SETGID - gosu switching to PUID/PGID (setuid/setgid/setgroups)
    # The application itself listens on port 5000 (>1024), so NET_BIND_SERVICE is not needed.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # Optional: read-only root filesystem. All state lives in the mounted volumes
    # (/Config holds the database, logs, caches and backups), but note the entrypoint
    # edits /etc/passwd and /etc/group when the PUID/PGID user does not already exist
    # in the image, so this only works if that step is not needed (or /etc is made
    # writable). Test before enabling.
    # read_only: true
    # tmpfs:
    #   - /tmp:size=256m,mode=1777
    networks:
      - comicmaintainer

networks:
  comicmaintainer:
    driver: bridge
