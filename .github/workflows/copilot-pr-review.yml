name: Request Copilot PR Review

# Automatically requests a Copilot code review on every pull request.
#
# Preferred alternative: enable "Request pull request review from Copilot" in a
# repository (or organization) ruleset targeting the default branch. This
# workflow exists as a fallback for when rulesets are unavailable.
#
# Note: no repository code is checked out or executed here, so using
# pull_request_target (needed so pull requests from forks get a token with
# pull-requests: write) does not expose the workflow to untrusted code.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Request review from Copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Requesting Copilot review on PR #$PR_NUMBER"

          # A 422 is returned when Copilot is already a requested reviewer (or
          # cannot review this pull request); that is not a failure condition.
          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]"; then
            echo "✅ Copilot review requested"
          else
            echo "ℹ️ Could not request a Copilot review (it may already be requested, or Copilot code review may not be enabled for this repository)"
          fi
