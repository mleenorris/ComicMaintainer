name: PR Test Check

# docs/TESTING_POLICY.md: code changes must come with tests. This check fails a pull request that
# changes the server's C# code or the web UI's JavaScript without changing anything under tests/.
# When a change genuinely needs no test (a pure refactor that existing tests cover, a log message),
# say why in the description and add the "no-tests-needed" label, which passes the check.
on:
  pull_request:
    branches: [ dotnet ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-tests:
    name: Tests included
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # File names come from the pull request, so they are only ever read from the environment and
      # from files, never expanded into the script.
      - name: Check for tests
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-tests-needed') }}
        run: |
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          # The server and the web UI. EF Core migrations and their designer files are generated.
          grep -E '^src/ComicMaintainer\.(Core|WebApi)/.*\.cs$|^src/ComicMaintainer\.WebApi/wwwroot/.*\.js$' changed-files.txt \
            | grep -vE '/Migrations/' > source-files.txt || true
          grep -E '^tests/' changed-files.txt > test-files.txt || true

          echo "Source files changed: $(wc -l < source-files.txt)"
          echo "Test files changed: $(wc -l < test-files.txt)"

          if [ ! -s source-files.txt ]; then
            echo "status=no_source_changes" >> "$GITHUB_OUTPUT"
          elif [ -s test-files.txt ]; then
            echo "status=tests_present" >> "$GITHUB_OUTPUT"
          elif [ "$SKIP_LABEL" = "true" ]; then
            echo "status=skipped_by_label" >> "$GITHUB_OUTPUT"
          else
            echo "status=missing_tests" >> "$GITHUB_OUTPUT"
            {
              echo "### Source files changed without test changes"
              echo
              sed 's/^/- /' source-files.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A pull request from a fork gets a read-only token, so the comment is best effort; the
      # failing step below is the check.
      - name: Comment on PR
        if: steps.check.outputs.status == 'missing_tests'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const policy = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/dotnet/docs/TESTING_POLICY.md`;
            const message = [
              '## ⚠️ Test Coverage Check',
              '',
              'This PR changes source code but no file under `tests/`.',
              '',
              '**Testing Requirements:**',
              '- ✅ All bug fixes MUST include tests that reproduce the issue',
              '- ✅ All new features MUST include unit and/or integration tests',
              '- ✅ Tests should cover both success and failure scenarios',
              '- ✅ Aim for at least 80% code coverage',
              '',
              'If the change genuinely needs no test, explain why in the PR description and add the `no-tests-needed` label.',
              '',
              `📚 See [TESTING_POLICY.md](${policy}) for detailed requirements.`
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Test Coverage Check'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }

      - name: Fail when tests are missing
        if: steps.check.outputs.status == 'missing_tests'
        run: |
          echo "::error::This pull request changes source code without changing tests. Add tests, or explain why none are needed and add the no-tests-needed label."
          exit 1

      - name: Result
        if: steps.check.outputs.status != 'missing_tests'
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "Test check: $STATUS"
