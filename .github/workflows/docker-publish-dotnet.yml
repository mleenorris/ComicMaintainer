name: Build and Push .NET Docker Image

on:
  # The release workflow (version-bump.yml) calls this for every push to dotnet, and only after
  # the unit, integration and container tests of the pushed commit have passed. It passes the
  # commit to build: the release commit when the run released a version, otherwise the tested
  # commit, which still moves :dotnet when it is the newest commit on dotnet.
  workflow_call:
    inputs:
      commit:
        description: 'The commit to build.'
        required: true
        type: string
      release:
        description: 'Whether the commit is a release the calling run tagged vX.Y.Z.'
        required: true
        type: boolean
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
  # Without a version, republishes the newest commit on dotnet, e.g. after a failed push to Docker
  # Hub; run it on dotnet, because :dotnet takes no other commit. With a version, rebuilds that
  # release from its vX.Y.Z git tag and pushes only the matching version tag, e.g. for a release
  # published before version tags existed.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to rebuild and tag, such as 2.0.399. Leave empty to republish dotnet.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  IMAGE_BASE: iceburn1/comicmaintainer

jobs:
  # Decides what to build and which tags it gets, from the commit alone, before anything is built.
  prepare:
    name: Decide tags and platforms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.get_version.outputs.version }}
      tags: ${{ steps.docker_tags.outputs.tags }}
      matrix: ${{ steps.docker_tags.outputs.matrix }}
      skip: ${{ steps.docker_tags.outputs.skip }}
    env:
      # Set only by a manual run that backfills a release. Scripts read inputs from the environment
      # rather than having them expanded into them, so an input can never run as shell code.
      REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      CALLED_COMMIT: ${{ github.event_name != 'workflow_dispatch' && inputs.commit || '' }}
      CALLED_RELEASE: ${{ github.event_name != 'workflow_dispatch' && inputs.release || false }}
    steps:
      - name: Validate inputs
        run: |
          if [[ -n "$REQUESTED_VERSION" && ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version input must be a release number such as 2.0.399, without a 'v' prefix or a fourth '.0' part."
            exit 1
          fi
          if [[ -n "$CALLED_COMMIT" && ! "$CALLED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The commit input must be a full commit hash."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A backfill builds the release's own source, which the version bump tagged vX.Y.Z. A
          # call builds the commit it was given; a republish takes the newest commit on dotnet.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') && format('refs/tags/v{0}', inputs.version) || (github.event_name != 'workflow_dispatch' && inputs.commit || '') }}

      - name: Record the commit
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get version from .NET project
        id: get_version
        run: |
          VERSION=$(grep -m 1 -oP '<Version>\K[^<]+' src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj || true)
          # A missing or malformed version would be published as a meaningless tag.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read an X.Y.Z <Version> from src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj"
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "::error::Tag v$REQUESTED_VERSION contains version $VERSION, so it cannot be published as $REQUESTED_VERSION."
            exit 1
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine Docker tags and platforms
        id: docker_tags
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          PLATFORMS="linux/amd64 linux/arm64"
          # Set when the run has nothing to publish, which skips the build.
          SKIP=false
          if [[ -n "$REQUESTED_VERSION" ]]; then
            # A backfill never moves :dotnet, which must stay on the newest release.
            TAGS="${IMAGE_BASE}:${VERSION}"
            # Rebuild a release for the platforms it was published for. Releases before 2.0.288
            # were amd64 only: their Dockerfile can build arm64 only by running the whole .NET SDK
            # under emulation.
            if ! grep -q 'linux/arm64' .github/workflows/docker-publish-dotnet.yml; then
              PLATFORMS="linux/amd64"
            fi
          else
            TAGS="${IMAGE_BASE}:dotnet"
            HEAD_COMMIT=$(git rev-parse HEAD)
            # Only the commit the version bump tagged vX.Y.Z is that release. A later commit, such
            # as a merge whose bump was skipped, still carries the previous version number, and
            # tagging it would replace that release's image with different code.
            REFS=$(git ls-remote origin "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}" refs/heads/dotnet)
            # The bump creates an annotated tag, whose commit is listed on the peeled "^{}" line;
            # a lightweight tag points at its commit directly.
            RELEASE_COMMIT=$(awk -v ref="refs/tags/v${VERSION}^{}" '$2 == ref { print $1 }' <<< "$REFS")
            if [[ -z "$RELEASE_COMMIT" ]]; then
              RELEASE_COMMIT=$(awk -v ref="refs/tags/v${VERSION}" '$2 == ref { print $1 }' <<< "$REFS")
            fi
            if [[ "$CALLED_RELEASE" == "true" && "$RELEASE_COMMIT" != "$HEAD_COMMIT" ]]; then
              echo "::error::The release workflow released ${HEAD_COMMIT}, but v${VERSION} is not tagged on it."
              exit 1
            fi
            # :dotnet takes only the newest commit on dotnet, so that it never goes back to an
            # older build. A run that dotnet has moved past, because it waited for another
            # publish or is a re-run, which builds its original commit again, leaves :dotnet to
            # the publish of the newer commits.
            DOTNET_TIP=$(awk '$2 == "refs/heads/dotnet" { print $1 }' <<< "$REFS")
            if [[ -z "$DOTNET_TIP" ]]; then
              echo "::error::The dotnet branch was not found on origin."
              exit 1
            fi
            if [[ "$DOTNET_TIP" == "$HEAD_COMMIT" ]]; then
              if [[ "$RELEASE_COMMIT" == "$HEAD_COMMIT" ]]; then
                TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:${VERSION}"
              else
                echo "::notice::This commit is not the v${VERSION} release, so only :dotnet is published."
              fi
            elif [[ "$RELEASE_COMMIT" == "$HEAD_COMMIT" ]]; then
              TAGS="${IMAGE_BASE}:${VERSION}"
              echo "::notice::dotnet has moved on since v${VERSION}, so only :${VERSION} is published. The publish of the newer commits moves :dotnet."
            else
              TAGS=""
              SKIP=true
              echo "::notice::Nothing is published, because this commit is neither the newest on dotnet nor the v${VERSION} release. The run for the newer commit publishes it."
            fi
          fi
          # Each platform is built and smoke tested on a runner of its own architecture, so arm64
          # runs natively instead of under QEMU emulation.
          MATRIX=$(for platform in $PLATFORMS; do
            case "$platform" in
              linux/amd64) runner=ubuntu-latest ;;
              linux/arm64) runner=ubuntu-24.04-arm ;;
            esac
            printf '{"platform":"%s","arch":"%s","runner":"%s"}\n' "$platform" "${platform#linux/}" "$runner"
          done | jq -sc '{include: .}')
          echo "Tags:"
          echo "$TAGS"
          echo "Matrix: $MATRIX"
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "matrix=$MATRIX"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"

  # Builds one platform's image, starts it and runs the container smoke test against it, and only
  # then pushes it, by digest and without a tag. Nothing is tagged until every platform passed.
  build:
    name: Build and test (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # mode=max caches every stage, including the SDK restore and compile, in the GitHub Actions
      # cache; the amd64 scope is the one the pull request's container test fills. A release's
      # version bump changes the project files, so a release build reuses only the layers before them.
      - name: Build image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.dotnet
          platforms: ${{ matrix.platform }}
          load: true
          tags: comicmaintainer:smoke
          cache-from: type=gha,scope=comicmaintainer-${{ matrix.arch }}
          cache-to: type=gha,scope=comicmaintainer-${{ matrix.arch }},mode=max

      - name: Run container smoke test
        env:
          IMAGE: comicmaintainer:smoke
          HOST_PORT: '5050'
          STARTUP_TIMEOUT: '180'
          PROCESSING_TIMEOUT: '90'
        run: ./scripts/container-smoke-test.sh

      - name: Capture container logs on failure
        if: failure()
        run: |
          mkdir -p ./smoke-logs
          docker logs comicmaintainer-smoke > ./smoke-logs/container.log 2>&1 || true

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-logs-${{ matrix.arch }}
          path: ./smoke-logs/
          if-no-files-found: ignore

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The same build again, served entirely from the cache the build above filled, so the image
      # pushed has the layers that were tested.
      - name: Push the tested image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.dotnet
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_BASE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=comicmaintainer-${{ matrix.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the tested platform images as one multi-platform image.
  publish:
    name: Publish tags
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publishes that move :dotnet share one group and queue instead of cancelling each other, so
    # the newest commit is the last to move :dotnet. A backfill, which never moves :dotnet, gets a
    # group of its own.
    concurrency:
      group: docker-publish-dotnet-${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') && github.run_id || 'dotnet' }}
      cancel-in-progress: false
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push the tags
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && TAG_ARGS+=(-t "$tag")
          done <<< "$TAGS"
          SOURCES=()
          for digest in *; do
            SOURCES+=("${IMAGE_BASE}@sha256:${digest}")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

      - name: Image summary
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          FIRST_TAG=$(head -n 1 <<< "$TAGS")
          DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{ json .Manifest }}' | jq -r '.digest')
          echo "Pushed $DIGEST with tags:"
          echo "$TAGS"
          {
            echo "### Published image"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            while IFS= read -r tag; do
              echo "- \`$tag\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
