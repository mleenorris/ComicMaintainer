name: Report CI Failure

# Files (or updates) a GitHub issue whenever one of the real CI workflows fails
# on a branch push, a scheduled run, or a manual dispatch.
#
# Pull-request failures are deliberately excluded: those already surface as a
# red check on the PR itself, and filing an issue for them would bury the signal
# from failures that nobody is actively looking at.
#
# `workflow_run` runs in the context of the default branch with the repository's
# own GITHUB_TOKEN, so no extra credentials are needed to open an issue. Note
# that issues created with GITHUB_TOKEN do NOT re-trigger other workflows, which
# is why the Copilot-agent handoff (assign-copilot-agent.yml) is driven by an
# explicit label applied by a maintainer rather than by issue creation.

on:
  workflow_run:
    workflows:
      - ".NET Tests"
      - "Build and Push .NET Docker Image"
      - "Security Vulnerability Scanning"
      - "CodeQL Advanced Security Scanning"
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  report-failure:
    name: File or update CI failure issue
    runs-on: ubuntu-latest
    # Only non-PR failures. `workflow_run.event` mirrors the event that started
    # the upstream run, so `pull_request` runs are filtered out here.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'pull_request_target'

    steps:
      - name: Find failing jobs and open or update the issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            // ---------------------------------------------------------------
            // Collect the failing jobs. Each workflow/job pair is reported
            // independently so that the dedupe marker is stable: if job A fails
            // alone and later A and B fail together, A keeps its own issue and
            // B gets a new one, instead of every combination of failures
            // opening a fresh issue.
            // ---------------------------------------------------------------
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, per_page: 100 }
            );
            const failedJobNames = jobs
              .filter(j => j.conclusion === 'failure')
              .map(j => j.name)
              .sort();

            // A run can fail without any job being marked failed (a cancelled
            // or infrastructure-level failure). Report it once under a stable
            // fallback key rather than dropping it.
            const jobKeys = failedJobNames.length > 0
              ? [...new Set(failedJobNames)]
              : ['(no failing job reported)'];

            // Fetch the open CI-failure issues once and match each marker
            // against them.
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'ci-failure', per_page: 100 }
            );

            for (const jobKey of jobKeys) {
              const marker = `<!-- ci-failure:${run.name}::${jobKey} -->`;

              // Deliberately no log excerpt. Raw CI output can contain private
              // paths, unmasked credentials and attacker-controlled Markdown
              // that breaks out of a code fence, and none of it passes through
              // the runtime reporter's redaction. The run link below gives a
              // maintainer the full log with no such exposure.
              const body = [
                marker,
                `## CI failure: ${run.name}`,
                '',
                `| | |`,
                `|---|---|`,
                `| **Workflow** | ${run.name} |`,
                `| **Failing job** | ${jobKey} |`,
                `| **Branch** | \`${run.head_branch}\` |`,
                `| **Commit** | ${run.head_sha} |`,
                `| **Trigger** | ${run.event} |`,
                `| **Run** | ${run.html_url} |`,
                `| **Detected** | ${new Date().toISOString()} |`,
                '',
                'Open the run above for the job logs. They are not copied here: CI output is',
                'unredacted and can carry credentials, private paths or content that escapes a',
                'Markdown code fence.',
                '',
                '---',
                '_Filed automatically by `report-ci-failure.yml`. Per',
                '[docs/TESTING_POLICY.md](../blob/dotnet/docs/TESTING_POLICY.md), any fix for this',
                'failure must include a regression test._',
              ].join('\n');

              const match = existing.find(issue => (issue.body || '').includes(marker));

              if (match) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: match.number,
                  body: `Still failing as of [run #${run.run_number}](${run.html_url}) on \`${run.head_branch}\` (${run.head_sha.slice(0, 7)}).`,
                });
                core.notice(`Commented on existing CI failure issue #${match.number} for job '${jobKey}'`);
                continue;
              }

              const created = await github.rest.issues.create({
                owner,
                repo,
                title: `[CI] ${run.name} failed on ${run.head_branch}: ${jobKey}`,
                body,
                labels: ['bug', 'ci-failure', 'auto-reported'],
              });
              core.notice(`Opened CI failure issue #${created.data.number} for job '${jobKey}'`);
            }
