<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Comic Maintainer</title>
    <meta name="theme-color" content="#241c17">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <!-- This page is precached by the service worker and shown when a
         navigation request fails because the device (or the server) is
         offline. It must therefore be completely self-contained: no external
         CSS or JS, no network requests at render time. -->
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background-color: #241c17;
            background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.4px);
            background-size: 6px 6px;
            border-top: 6px solid #c9302c;
            color: #fbf3e4;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            max-width: 460px;
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-family: "Bangers", "Anton", "Impact", "Arial Black", sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #ffc845;
        }

        p {
            margin: 0 0 20px;
            line-height: 1.5;
            color: #d8c9b4;
        }

        button {
            font: inherit;
            font-weight: 600;
            padding: 10px 22px;
            border: 2px solid #000;
            border-radius: 8px;
            background: #c9302c;
            color: #fff;
            box-shadow: 3px 3px 0 #000;
            cursor: pointer;
        }

        button:hover {
            background: #d9443f;
        }

        button:focus-visible {
            outline: 2px solid #ffc845;
            outline-offset: 2px;
        }

        .status {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #b3a493;
        }

        .downloads {
            margin-top: 28px;
            text-align: left;
        }

        .downloads h2 {
            font-size: 1.05rem;
            margin: 0 0 10px;
        }

        .downloads ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .downloads li {
            margin-bottom: 8px;
        }

        .downloads a {
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fbf3e4;
            text-decoration: none;
            word-break: break-word;
        }

        .downloads a:hover,
        .downloads a:focus-visible {
            background: rgba(255, 255, 255, 0.16);
        }

        .downloads .pages {
            display: block;
            font-size: 0.8rem;
            color: #d8c9b4;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192x192.png" alt="" width="96" height="96">
        <h1>You're offline</h1>
        <p>
            Comic Maintainer needs a connection to your library server. The page you
            requested isn't available while offline.
        </p>
        <button type="button" id="retryButton">Try again</button>
        <p class="status" id="statusText" role="status" aria-live="polite"></p>
        <section class="downloads" id="downloads" hidden>
            <h2>Saved for offline reading</h2>
            <ul id="downloadsList"></ul>
        </section>
    </main>
    <script src="/js/pages/offline.js?v=__APP_VERSION__"></script>
</body>
</html>
