name: Build Android APK

# The release workflow (version-bump.yml) calls this with the tag of every release and attaches the
# Android APK to that release. A tag pushed with GITHUB_TOKEN cannot start a workflow, so a tag
# trigger would never run for the automatic releases. Run it by hand with a tag to rebuild a
# release's downloads, or without one to build the selected branch without publishing anything.
on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to build and attach the downloads to, such as v3.0.1.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the downloads to, such as v3.0.1. Leave empty to build the selected branch without publishing.'
        required: false
        default: ''
        type: string

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Attaches the downloads to the release.
      contents: write
    env:
      # Read from the environment rather than expanded into scripts, so the input can never run as
      # shell code.
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate the release tag
        if: inputs.tag != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "The tag must be a release tag such as v3.0.1, got: $env:RELEASE_TAG"
            exit 1
          }

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Get version from tag or project
        id: get_version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -match '^v(.+)$') {
            $version = $matches[1]
          } else {
            $version = (Select-Xml -Path "src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj" -XPath "//Version" | Select-Object -First 1).Node.InnerText
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # The app has a solution of its own, so that the main one builds without the Android workload.
      - name: Restore dependencies
        run: dotnet restore src/ComicMaintainer.Android.sln

      # Releases are signed with the project's own key when the ANDROID_KEYSTORE_BASE64 secret is set, so each release
      # installs over the one before. Without it the build signs with a debug key made on the runner, which differs every
      # time. docs/MAUI_ANDROID_SETUP.md explains how to create the key and the three secrets.
      - name: Prepare the signing key
        id: signing
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            Write-Output "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this APK is signed with a throwaway debug key and will not install over an earlier release."
            Write-Output "keystore=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS) -or [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD)) {
            Write-Error "ANDROID_KEYSTORE_BASE64 is set, so ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD must be set too."
            exit 1
          }
          $path = Join-Path $env:RUNNER_TEMP 'comicmaintainer-release.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          Write-Output "keystore=$path" >> $env:GITHUB_OUTPUT

      # Publish, not build: publishing is what produces the signed package, in the publish folder.
      - name: Build Android APK
        shell: pwsh
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # MSBuild reads it through the env: prefix below, so the password never appears on a command line.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $signing = @()
          if ($env:KEYSTORE_PATH) {
            # A PKCS12 keystore, as keytool makes by default, has one password for the store and the key.
            $signing = @('-p:AndroidKeyStore=true', "-p:AndroidSigningKeyStore=$env:KEYSTORE_PATH",
              "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
              '-p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD', '-p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD')
          }
          dotnet publish src/ComicMaintainer.MauiApp/ComicMaintainer.MauiApp.csproj `
            -c Release `
            -f net11.0-android `
            -p:AndroidPackageFormat=apk `
            @signing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate APK
        id: locate_apk
        shell: pwsh
        run: |
          # Only the signed package can be installed; the build also leaves an unsigned one next to it.
          $apkPath = Get-ChildItem -Path "src/ComicMaintainer.MauiApp/bin/Release/net11.0-android/publish" -Filter "*-Signed.apk" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($apkPath) {
            Write-Host "Found APK at: $apkPath"
            $apkName = "ComicMaintainer-v${{ steps.get_version.outputs.version }}-android.apk"
            Copy-Item $apkPath -Destination $apkName
            Write-Output "apk_file=$apkName" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "APK not found"
            exit 1
          }

      # The certificate's SHA-256 fingerprint identifies the signing key; it has to stay the same from release to release.
      - name: Show the signing certificate
        continue-on-error: true
        shell: pwsh
        env:
          APK_FILE: ${{ steps.locate_apk.outputs.apk_file }}
        run: |
          $keytool = if ($env:JAVA_HOME) { Join-Path $env:JAVA_HOME 'bin\keytool.exe' } else { 'keytool' }
          & $keytool -printcert -jarfile $env:APK_FILE | Select-String -Pattern '^\s*(Owner|SHA256):'

      - name: Create README for Android release
        shell: pwsh
        run: |
          $readmeContent = @"
          # ComicMaintainer Android App

          ## Installation

          1. Download the APK file to your Android device
          2. Enable "Install from Unknown Sources" in your device settings
          3. Tap the APK file to install
          4. Open the ComicMaintainer app

          ## Signing In

          1. Open the app
          2. Enter your ComicMaintainer server URL, including http:// or https://
             - Example: https://comics.example.com or http://192.168.1.100:5000
          3. Enter the username and password of your ComicMaintainer account
             - Or turn on "Sign in with an API key" and paste a key you created
          4. Tap "Sign in"

          The app keeps your session in the device's secure storage and never stores your password.
          When the session ends (by default after 24 hours, or when your password changes), the app
          returns to the sign-in page and says why.

          ## Server Requirements

          Your ComicMaintainer server must be:
          - Set up already: create the administrator account in a web browser first
          - Running and accessible from your Android device

          ## Network Configuration

          ### Local Network Access:
          - Find your server's local IP address (e.g., 192.168.1.100)
          - Use format: http://[IP-ADDRESS]:5000
          - Plain http:// sends your password unencrypted, and the app warns about it. Use it only on a network you trust

          ### Remote Access:
          - Use HTTPS
          - Format: https://your-domain.com
          - If a sign-on page such as Authelia protects the server, requests from the app must be let through to it

          ## Features

          - Sign in with a password or an API key
          - Browse comic files on your server, page by page
          - Process and delete individual files or a selection
          - Filter by processing status (all, unmarked, marked, duplicates)
          - Search for specific files

          ## Troubleshooting

          ### Cannot connect to server:
          - On the sign-in page, tap "Test Connection"; it says what went wrong
          - Verify server is running and the address is correct
          - Ensure devices are on same network, and check firewall settings on server

          ### "Too many requests":
          - The server limits sign-in attempts. Wait for the time it names, then try again

          ## System Requirements

          - Android 7.0 (API 24) or later
          - Internet/network connectivity

          ## Updating

          Each release is signed with a temporary key, so Android refuses to install it over an earlier
          one. Uninstall the app first, then install the new version and sign in again.

          ## Security Notes

          - Use HTTPS when accessing over the internet
          - Only install APKs from trusted sources

          ## Support

          For issues and documentation, visit: https://github.com/mleenorris/ComicMaintainer
          "@

          $readmeContent | Out-File -FilePath "ANDROID_README.txt" -Encoding UTF8

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ComicMaintainer-android-apk
          path: |
            ${{ steps.locate_apk.outputs.apk_file }}
            ANDROID_README.txt

      # The release workflow created the release with its notes; this adds the APK to it.
      - name: Attach to the GitHub release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.locate_apk.outputs.apk_file }}
            ANDROID_README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the signing key
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'comicmaintainer-release.keystore')
