name: Build Android APK

# The release workflow (version-bump.yml) calls this with the tag of every release and attaches the
# Android APK to that release. A tag pushed with GITHUB_TOKEN cannot start a workflow, so a tag
# trigger would never run for the automatic releases. Run it by hand with a tag to rebuild a
# release's downloads, or without one to build the selected branch without publishing anything.
on:
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to build and attach the downloads to, such as v3.0.1.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the downloads to, such as v3.0.1. Leave empty to build the selected branch without publishing.'
        required: false
        default: ''
        type: string

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # Attaches the downloads to the release.
      contents: write
    env:
      # Read from the environment rather than expanded into scripts, so the input can never run as
      # shell code.
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Validate the release tag
        if: inputs.tag != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "The tag must be a release tag such as v3.0.1, got: $env:RELEASE_TAG"
            exit 1
          }

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Get version from tag or project
        id: get_version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -match '^v(.+)$') {
            $version = $matches[1]
          } else {
            $version = (Select-Xml -Path "src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj" -XPath "//Version" | Select-Object -First 1).Node.InnerText
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # The app has a solution of its own, so that the main one builds without the Android workload.
      - name: Restore dependencies
        run: dotnet restore ComicMaintainer.Android.sln

      # Publish, not build: publishing is what produces the signed package, in the publish folder.
      - name: Build Android APK
        run: |
          dotnet publish src/ComicMaintainer.MauiApp/ComicMaintainer.MauiApp.csproj `
            -c Release `
            -f net10.0-android `
            -p:AndroidPackageFormat=apk

      - name: Locate APK
        id: locate_apk
        shell: pwsh
        run: |
          # Only the signed package can be installed; the build also leaves an unsigned one next to it.
          $apkPath = Get-ChildItem -Path "src/ComicMaintainer.MauiApp/bin/Release/net10.0-android/publish" -Filter "*-Signed.apk" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if ($apkPath) {
            Write-Host "Found APK at: $apkPath"
            $apkName = "ComicMaintainer-v${{ steps.get_version.outputs.version }}-android.apk"
            Copy-Item $apkPath -Destination $apkName
            Write-Output "apk_file=$apkName" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "APK not found"
            exit 1
          }

      - name: Create README for Android release
        shell: pwsh
        run: |
          $readmeContent = @"
          # ComicMaintainer Android App

          ## Installation

          1. Download the APK file to your Android device
          2. Enable "Install from Unknown Sources" in your device settings
          3. Tap the APK file to install
          4. Open the ComicMaintainer app

          ## Signing In

          1. Open the app
          2. Enter your ComicMaintainer server URL, including http:// or https://
             - Example: https://comics.example.com or http://192.168.1.100:5000
          3. Enter the username and password of your ComicMaintainer account
             - Or turn on "Sign in with an API key" and paste a key you created
          4. Tap "Sign in"

          The app keeps your session in the device's secure storage and never stores your password.
          When the session ends (by default after 24 hours, or when your password changes), the app
          returns to the sign-in page and says why.

          ## Server Requirements

          Your ComicMaintainer server must be:
          - Set up already: create the administrator account in a web browser first
          - Running and accessible from your Android device

          ## Network Configuration

          ### Local Network Access:
          - Find your server's local IP address (e.g., 192.168.1.100)
          - Use format: http://[IP-ADDRESS]:5000
          - Plain http:// sends your password unencrypted, and the app warns about it. Use it only on a network you trust

          ### Remote Access:
          - Use HTTPS
          - Format: https://your-domain.com
          - If a sign-on page such as Authelia protects the server, requests from the app must be let through to it

          ## Features

          - Sign in with a password or an API key
          - Browse comic files on your server, page by page
          - Process and delete individual files or a selection
          - Filter by processing status (all, unmarked, marked, duplicates)
          - Search for specific files

          ## Troubleshooting

          ### Cannot connect to server:
          - Open Settings and tap "Test Connection"; it says what went wrong
          - Verify server is running and the address is correct
          - Ensure devices are on same network, and check firewall settings on server

          ### "Too many requests":
          - The server limits sign-in attempts. Wait for the time it names, then try again

          ## System Requirements

          - Android 6.0 (API 23) or later
          - Internet/network connectivity

          ## Updating

          Each release is signed with a temporary key, so Android refuses to install it over an earlier
          one. Uninstall the app first, then install the new version and sign in again.

          ## Security Notes

          - Use HTTPS when accessing over the internet
          - Only install APKs from trusted sources

          ## Support

          For issues and documentation, visit: https://github.com/mleenorris/ComicMaintainer
          "@

          $readmeContent | Out-File -FilePath "ANDROID_README.txt" -Encoding UTF8

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ComicMaintainer-android-apk
          path: |
            ${{ steps.locate_apk.outputs.apk_file }}
            ANDROID_README.txt

      # The release workflow created the release with its notes; this adds the APK to it.
      - name: Attach to the GitHub release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag }}
          fail_on_unmatched_files: true
          files: |
            ${{ steps.locate_apk.outputs.apk_file }}
            ANDROID_README.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
