# ComicMaintainer subfolder configuration for SWAG
# This file should be placed in your SWAG config folder at:
# /config/nginx/proxy-confs/comicmaintainer.subfolder.conf
#
# Access ComicMaintainer at: https://yourdomain.com/comics
#
# IMPORTANT: You must set the BASE_PATH environment variable in your ComicMaintainer container:
# -e BASE_PATH=/comics
#
# To serve it under another folder, change /comics in both location lines and the redirect below,
# and set BASE_PATH to the same value.

location /comics {
    return 301 $scheme://$host/comics/;
}

location ^~ /comics/ {
    # enable the next two lines for http auth
    #auth_basic "Restricted";
    #auth_basic_user_file /config/nginx/.htpasswd;

    # enable for ldap auth (requires ldap-server.conf in the server block)
    #include /config/nginx/ldap-location.conf;

    # enable for Authelia (requires authelia-server.conf in the server block)
    # Uncomment the line below to enable Authelia authentication
    # (ComicMaintainer then needs AUTHELIA_ENABLED=true and AUTHELIA_TRUSTED_PROXIES=<SWAG's IP or subnet>, see docs/AUTHELIA.md)
    #include /config/nginx/authelia-location.conf;

    # enable for Authentik (requires authentik-server.conf in the server block)
    #include /config/nginx/authentik-location.conf;

    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;
    set $upstream_app comicmaintainer;
    set $upstream_port 5000;
    set $upstream_proto http;
    # No path after the port: nginx then passes the request on unchanged, with /comics still on it,
    # and ComicMaintainer removes the prefix itself (BASE_PATH). With variables in proxy_pass, a path
    # here, even a single /, would replace the whole request path.
    proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    # Standard proxy headers
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Standard SWAG connection headers (real-time updates use Server-Sent Events, not WebSockets)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts for long-running operations (10 minutes)
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Disable buffering for Server-Sent Events (SSE)
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
}
