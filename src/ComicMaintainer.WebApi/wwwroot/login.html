<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Comic Maintainer</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Login to Comic Maintainer">
    <meta name="theme-color" content="#241c17">
    
    <!-- Cache Control for HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Favicons and Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    
    <style>
        :root {
            /* Mirrors the warm comic palette in css/main.css (this page is
               standalone and does not load that stylesheet). */
            --bg-primary: #f6efe3;
            --bg-secondary: #fffdf8;
            --bg-header: #241c17;
            --text-primary: #2a221d;
            --text-secondary: #3d322b;
            --text-muted: #6f6158;
            --border-input: #d9cbb6;
            --ink: #241c17;
            --brand-yellow: #ffc845;
            --shadow-md: 6px 6px 0 #241c17;
            --primary-color: #c9302c;
            --primary-hover: #a8241f;
            --focus-ring: rgba(201, 48, 44, 0.25);
            --danger-color: #b0261f;
            --danger-bg: #fdecea;
            --success-color: #2f7d32;
            --success-bg: #e9f5e9;
            --halftone: radial-gradient(rgba(36, 28, 23, 0.09) 1px, transparent 1.5px);
            --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-display: "Bangers", "Anton", "Impact", "Arial Black", var(--font-sans);
        }
        
        [data-theme="dark"] {
            --bg-primary: #17120f;
            --bg-secondary: #221b16;
            --bg-header: #120e0b;
            --text-primary: #f3e9da;
            --text-secondary: #e2d5c3;
            --text-muted: #b3a493;
            --border-input: #4a3d33;
            --ink: #000000;
            --shadow-md: 6px 6px 0 #000000;
            --primary-color: #ef5a4f;
            --primary-hover: #f37a70;
            --focus-ring: rgba(239, 90, 79, 0.3);
            --danger-color: #ff8f84;
            --danger-bg: rgba(239, 90, 79, 0.14);
            --success-color: #7fd08a;
            --success-bg: rgba(127, 208, 138, 0.12);
            --halftone: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.5px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            background-image: var(--halftone);
            background-size: 8px 8px;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .login-container {
            position: relative;
            background: var(--bg-secondary);
            border: 3px solid var(--ink);
            border-top: 8px solid var(--primary-color);
            border-radius: 14px;
            box-shadow: var(--shadow-md);
            padding: 36px 40px 40px;
            width: 100%;
            max-width: 400px;
            transition: background-color 0.3s;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            margin-bottom: 16px;
        }

        .brand-logo {
            filter: drop-shadow(3px 3px 0 var(--ink));
        }
        
        .login-header h1 {
            color: var(--text-primary);
            font-family: var(--font-display);
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-input);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }
        
        /* Controls above clear the default outline for mouse users. Keyboard
           users still need a visible focus indicator, so restore one via
           :focus-visible, which only matches keyboard/AT focus. This mirrors
           the global rule in css/main.css; this page is standalone and does
           not load that stylesheet. */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }
        
        .btn {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--ink);
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s, background-color 0.12s;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: white;
            box-shadow: 3px 3px 0 var(--ink);
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 var(--ink);
        }

        .btn-primary:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink);
        }
        
        .btn-primary:disabled {
            background: var(--text-muted);
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }
        
        .error-message {
            background: var(--danger-bg);
            border-left: 4px solid var(--danger-color);
            color: var(--danger-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: var(--success-bg);
            border-left: 4px solid var(--success-color);
            color: var(--success-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .form-footer {
            margin-top: 20px;
            text-align: center;
        }
        
        .form-footer button {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
        }
        
        .form-footer button:hover {
            color: var(--primary-hover);
        }
        
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--ink);
            border-radius: 50%;
            box-shadow: 2px 2px 0 var(--ink);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }
        
        .theme-toggle:hover {
            transform: scale(1.1);
        }
        
        /* Respect the OS "reduce motion" preference, as css/main.css does for
           the rest of the app. The spinner is exempt: it replaces the button
           label while the request is in flight, so freezing it would leave the
           user with no feedback at all. */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .spinner {
                animation-duration: 0.6s !important;
                animation-iteration-count: infinite !important;
            }
            
            .theme-toggle:hover {
                transform: none;
            }
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark theme" title="Toggle Theme">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    
    <main class="login-container">
        <div class="login-header">
            <div class="logo">
                <svg class="brand-logo" width="72" height="72" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <rect x="2" y="2" width="36" height="36" rx="9" fill="#c9302c"/>
                    <path d="M20 6.5l3.3 6.4 7-1.9-3.2 6.5 5.9 4.2-7.1 1.6.6 7.2L20 26.6l-6.5 3.9.6-7.2-7.1-1.6 5.9-4.2-3.2-6.5 7 1.9z" fill="#ffc845" stroke="#241c17" stroke-width="1.6" stroke-linejoin="round"/>
                    <text x="20" y="22.6" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="8.5" fill="#241c17">CM</text>
                </svg>
            </div>
            <h1>Comic Maintainer</h1>
            <p>Sign in to manage your comic library</p>
        </div>
        
        <div id="errorMessage" class="error-message" role="alert"></div>
        <div id="successMessage" class="success-message" role="status" aria-live="polite"></div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span id="loginBtnText">Sign In</span>
                <span id="loginBtnSpinner" class="spinner hidden"></span>
            </button>
        </form>
        

    </main>
    
    <script src="/js/pages/login.js?v=__APP_VERSION__"></script>
</body>
</html>
