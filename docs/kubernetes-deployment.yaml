---
# Kubernetes Deployment for ComicMaintainer (.NET)
#
# ComicMaintainer keeps its state in a SQLite database under /Config and watches the library for changes, so exactly
# one pod may run at a time: two pods would write the same database file and process and rename the same comics. The
# Deployment therefore runs a single replica and uses the Recreate strategy, which stops the old pod before an
# upgrade starts the new one. Never scale it up or add a HorizontalPodAutoscaler.
#
# Before applying this file, create the namespace and the secret the pod reads its JWT signing key and the first
# admin account's password from (both are read from files, so they never appear in the pod spec):
#
#   kubectl create namespace comicmaintainer
#   kubectl -n comicmaintainer create secret generic comicmaintainer-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=admin-password='choose-a-strong-password'
#
# Then: kubectl apply -f kubernetes-deployment.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: comicmaintainer

---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: comicmaintainer-config
  namespace: comicmaintainer
data:
  WATCHED_DIR: "/watched_dir"
  DUPLICATE_DIR: "/duplicates"
  AppSettings__MaxWorkers: "4"
  # The app runs as this user and group. The library volumes are not chowned at start: the pod's fsGroup below gives
  # PGID access to them. Set FIX_LIBRARY_PERMISSIONS to "true" once to hand an existing library to PUID:PGID.
  PUID: "1000"
  PGID: "1000"
  ADMIN_USERNAME: "admin"
  JWT_SECRET_FILE: "/run/secrets/comicmaintainer/jwt-secret"
  ADMIN_PASSWORD_FILE: "/run/secrets/comicmaintainer/admin-password"

---
# PersistentVolumeClaim for config storage: the SQLite database, its backups, DataProtection keys and logs.
# Use block or local storage; SQLite on NFS/SMB risks database corruption.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comicmaintainer-config-pvc
  namespace: comicmaintainer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Optional: Specify storage class
  # storageClassName: standard

---
# PersistentVolumeClaim for the comic library. ReadWriteMany lets other apps (Komga, Kavita, Suwayomi) share it;
# ComicMaintainer itself still runs as a single pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comicmaintainer-comics-pvc
  namespace: comicmaintainer
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  # Optional: Specify storage class
  # storageClassName: nfs-client

---
# PersistentVolumeClaim for files moved aside as duplicates (DUPLICATE_DIR).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comicmaintainer-duplicates-pvc
  namespace: comicmaintainer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comicmaintainer
  namespace: comicmaintainer
  labels:
    app: comicmaintainer
spec:
  # Exactly one: see the note at the top of this file.
  replicas: 1
  # The default RollingUpdate starts the new pod before stopping the old one, so for a while both would use the same
  # SQLite database and library (or the new pod would hang waiting for the ReadWriteOnce config volume).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comicmaintainer
  template:
    metadata:
      labels:
        app: comicmaintainer
    spec:
      containers:
      - name: comicmaintainer
        # :dotnet follows the newest release. Pin a version (for example iceburn1/comicmaintainer:3.0.0) to upgrade
        # only when you choose to; the database is backed up before each upgrade's migrations.
        image: iceburn1/comicmaintainer:dotnet
        imagePullPolicy: Always

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: comicmaintainer-config

        # Ports
        ports:
        - name: web
          containerPort: 5000
          protocol: TCP

        # Volume mounts
        volumeMounts:
        - name: config
          mountPath: /Config
        - name: comics
          mountPath: /watched_dir
        - name: duplicates
          mountPath: /duplicates
        - name: secrets
          mountPath: /run/secrets/comicmaintainer
          readOnly: true

        # Resource limits and requests
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi

        # Startup probe: the first start and upgrades apply database migrations (after backing the database up),
        # which can take a few minutes on a large library. Allows up to 5 minutes.
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

        # Liveness: the process is up and serving requests.
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        # Readiness: also checks that the database is reachable.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

      # Volumes
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: comicmaintainer-config-pvc
      - name: comics
        persistentVolumeClaim:
          claimName: comicmaintainer-comics-pvc
      - name: duplicates
        persistentVolumeClaim:
          claimName: comicmaintainer-duplicates-pvc
      - name: secrets
        secret:
          secretName: comicmaintainer-secrets
          # The entrypoint starts as root and the app reads the files as PUID through the fsGroup below.
          defaultMode: 0440

      securityContext:
        # Volumes that support it are made group-owned by PGID, so the app user can write the library without the
        # entrypoint changing it. OnRootMismatch only walks a volume whose top folder does not already match, instead
        # of every file of a large library at every start.
        fsGroup: 1000  # Match PGID
        fsGroupChangePolicy: "OnRootMismatch"

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: comicmaintainer
  namespace: comicmaintainer
  labels:
    app: comicmaintainer
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: web
  selector:
    app: comicmaintainer

---
# Ingress (optional - configure for your ingress controller)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comicmaintainer
  namespace: comicmaintainer
  annotations:
    # Example for nginx ingress controller
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  labels:
    app: comicmaintainer
spec:
  # Optional: TLS configuration
  # tls:
  # - hosts:
  #   - comicmaintainer.example.com
  #   secretName: comicmaintainer-tls
  rules:
  - host: comicmaintainer.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: comicmaintainer
            port:
              number: 5000
