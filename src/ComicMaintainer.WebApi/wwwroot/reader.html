<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Reader - Comic Maintainer</title>
    
    <!-- Cache Control for HTML -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="stylesheet" href="/css/main.css" id="mainCss">
    
    <!-- Version-based cache busting script -->
    <script>
        // Fetch version and update CSS URL to include version parameter for cache busting
        (async function() {
            try {
                const response = await fetch('/api/version');
                const data = await response.json();
                const version = data.version;
                
                // Update CSS link with version parameter
                const cssLink = document.getElementById('mainCss');
                if (cssLink) {
                    cssLink.href = `/css/main.css?v=${version}`;
                }
            } catch (error) {
                console.error('Failed to fetch version for cache busting:', error);
            }
        })();
    </script>
    <style>
        body.reader-mode {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        .reader-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .reader-header {
            background: rgba(0, 0, 0, 0.9);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 1000;
        }

        .reader-header h1 {
            font-size: 1rem;
            margin: 0;
            font-weight: normal;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reader-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .reader-controls button,
        .reader-controls select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .reader-controls button:hover,
        .reader-controls select:hover {
            background: #444;
        }

        .reader-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.9rem;
            color: #aaa;
            white-space: nowrap;
        }

        .reader-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .page-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .loading {
            color: #fff;
            font-size: 1.2rem;
        }

        .error {
            color: #f44;
            font-size: 1.2rem;
            padding: 2rem;
            text-align: center;
        }

        .reader-footer {
            background: rgba(0, 0, 0, 0.9);
            padding: 1rem;
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .reader-footer button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .reader-footer button:hover {
            background: #444;
        }

        .reader-footer button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }

        .fullscreen-mode .reader-header,
        .fullscreen-mode .reader-footer {
            transition: opacity 0.3s;
        }

        .fullscreen-mode.auto-hide .reader-header,
        .fullscreen-mode.auto-hide .reader-footer {
            opacity: 0;
            pointer-events: none;
        }

        .fullscreen-mode.auto-hide:hover .reader-header,
        .fullscreen-mode.auto-hide:hover .reader-footer {
            opacity: 1;
            pointer-events: all;
        }

        /* Keyboard shortcuts help */
        .shortcuts-help {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #555;
            border-radius: 8px;
            padding: 2rem;
            z-index: 10000;
            max-width: 400px;
            display: none;
        }

        .shortcuts-help.show {
            display: block;
        }

        .shortcuts-help h2 {
            margin-top: 0;
        }

        .shortcuts-help ul {
            list-style: none;
            padding: 0;
        }

        .shortcuts-help li {
            padding: 0.5rem 0;
            display: flex;
            justify-content: space-between;
        }

        .shortcuts-help kbd {
            background: #333;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-family: monospace;
        }

        .close-help {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
        }

        /* Continuous scroll mode styles */
        .reader-content.webcomic-mode {
            overflow-y: auto;
            overflow-x: hidden;
            align-items: flex-start;
            /* Hide scrollbar for Chrome, Safari and Opera */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
        }
        
        .reader-content.webcomic-mode::-webkit-scrollbar {
            display: none; /* Chrome, Safari and Opera */
        }

        .webcomic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 0;
        }

        .webcomic-container img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .loading-indicator {
            padding: 2rem;
            text-align: center;
            color: #aaa;
        }

        .mode-toggle {
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .mode-toggle:hover {
            background: #555;
        }

        /* Comic transition separator */
        .comic-transition {
            width: 100%;
            padding: 3rem 2rem;
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(30,30,30,0.95) 50%, rgba(0,0,0,0.95) 100%);
            border-top: 3px solid #444;
            border-bottom: 3px solid #444;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
            margin: 2rem 0;
        }

        .comic-transition-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }

        .comic-transition-subtitle {
            font-size: 1rem;
            color: #aaa;
            margin: 0;
        }

        .comic-transition-arrow {
            font-size: 2rem;
            color: #666;
        }

        .comic-transition-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            min-width: 300px;
        }

        .comic-transition-leaving {
            color: #888;
            font-size: 0.9rem;
        }

        .comic-transition-entering {
            color: #4CAF50;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="reader-mode">
    <div class="reader-container" id="readerContainer">
        <div class="reader-header">
            <button onclick="goBack()" title="Back to files">← Back</button>
            <h1 id="comicTitle">Loading...</h1>
            <div class="reader-controls">
                <button class="mode-toggle" onclick="toggleReadingMode()" id="modeToggleBtn" title="Toggle reading mode">Mode: Manga</button>
                <span class="page-info" id="pageInfo">Page 1 / 1</span>
                <select id="pageSelect" name="pageSelect" onchange="goToPage(this.value)">
                    <option value="1">Page 1</option>
                </select>
                <button onclick="toggleFullscreen()" id="fullscreenBtn">Fullscreen</button>
                <button onclick="showHelp()" title="Keyboard shortcuts">?</button>
            </div>
        </div>
        
        <div class="reader-content" id="readerContent">
            <div class="loading">Loading comic...</div>
        </div>
        
        <div class="reader-footer">
            <button id="prevBtn" onclick="previousPage()" disabled>← Previous</button>
            <button onclick="toggleFullscreen()">Toggle Fullscreen</button>
            <button id="nextBtn" onclick="nextPage()" disabled>Next →</button>
        </div>
    </div>

    <div class="shortcuts-help" id="shortcutsHelp">
        <button class="close-help" onclick="hideHelp()">×</button>
        <h2>Keyboard Shortcuts</h2>
        <ul>
            <li><span>Previous Page</span> <kbd>←</kbd> or <kbd>A</kbd></li>
            <li><span>Next Page</span> <kbd>→</kbd> or <kbd>D</kbd></li>
            <li><span>First Page</span> <kbd>Home</kbd></li>
            <li><span>Last Page</span> <kbd>End</kbd></li>
            <li><span>Toggle Reading Mode</span> <kbd>M</kbd></li>
            <li><span>Toggle Fullscreen</span> <kbd>F</kbd></li>
            <li><span>Show Help</span> <kbd>?</kbd></li>
            <li><span>Exit Reader</span> <kbd>Esc</kbd></li>
        </ul>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let comicFilePath = '';
        let currentComicName = '';
        let token = '';
        let readingMode = 'manga'; // 'manga' or 'webcomic'
        let loadedPages = new Set();
        let isLoadingNext = false;
        let nextComicInfo = null;
        let hasScrolledToBottom = false;
        let hasMarkedAsRead = false;
        let pageObserver = null; // Intersection Observer for tracking visible pages
        let currentVisiblePage = 1; // Track the currently visible page in webcomic mode

        // Get parameters from URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Initialize reader
        async function initReader() {
            comicFilePath = getQueryParam('file');
            token = localStorage.getItem('jwt_token') || '';
            const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';

            if (!comicFilePath) {
                showError('No comic file specified');
                return;
            }

            // Check authentication - allow either JWT token or Authelia authentication
            if (!token && !isAutheliaAuth) {
                window.location.href = '/login.html';
                return;
            }

            try {
                // Prepare fetch options with proper authentication
                const fetchOptions = {
                    credentials: 'include' // Important for Authelia cookies
                };
                
                // Add Authorization header only for JWT authentication
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }

                // Get comic info
                const response = await fetch(`/api/ComicReader/info?filePath=${encodeURIComponent(comicFilePath)}`, fetchOptions);

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Failed to load comic info');
                }

                const data = await response.json();
                totalPages = data.pageCount;
                currentComicName = data.fileName;
                
                document.getElementById('comicTitle').textContent = data.fileName;
                document.title = `${data.fileName} - Comic Reader`;
                
                // Populate page select
                const pageSelect = document.getElementById('pageSelect');
                pageSelect.innerHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `Page ${i}`;
                    pageSelect.appendChild(option);
                }

                // Load saved reading mode preference
                readingMode = localStorage.getItem('readingMode') || 'manga';
                updateModeUI();

                // Load saved reading progress
                const savedPage = await loadReadingProgress();
                currentPage = Math.min(savedPage, totalPages); // Ensure page is within bounds

                // Load first page or all pages depending on mode
                if (readingMode === 'webcomic') {
                    await loadWebcomicMode();
                } else {
                    await loadPage(currentPage);
                }

                // Prefetch next comic info for seamless transition
                await prefetchNextComic();
            } catch (error) {
                console.error('Error initializing reader:', error);
                showError('Failed to load comic: ' + error.message);
            }
        }

        // Toggle between manga and webcomic reading modes
        async function toggleReadingMode() {
            readingMode = readingMode === 'manga' ? 'webcomic' : 'manga';
            localStorage.setItem('readingMode', readingMode);
            updateModeUI();
            
            // Reload content in new mode
            const content = document.getElementById('readerContent');
            content.innerHTML = '<div class="loading">Switching mode...</div>';
            
            if (readingMode === 'webcomic') {
                await loadWebcomicMode();
            } else {
                await loadPage(currentPage);
            }
        }

        // Update UI based on reading mode
        function updateModeUI() {
            const modeBtn = document.getElementById('modeToggleBtn');
            const content = document.getElementById('readerContent');
            const footer = document.querySelector('.reader-footer');
            const pageInfo = document.getElementById('pageInfo');
            const pageSelect = document.getElementById('pageSelect');
            
            if (readingMode === 'webcomic') {
                modeBtn.textContent = 'Mode: Webcomic';
                content.classList.add('webcomic-mode');
                footer.style.display = 'none';
                // Keep page info visible in webcomic mode to show current page
                pageInfo.style.display = 'inline';
                pageSelect.style.display = 'none';
            } else {
                modeBtn.textContent = 'Mode: Manga';
                content.classList.remove('webcomic-mode');
                footer.style.display = 'flex';
                pageInfo.style.display = 'inline';
                pageSelect.style.display = 'inline';
            }
        }

        // Load all pages in continuous scroll mode
        async function loadWebcomicMode() {
            const content = document.getElementById('readerContent');
            content.innerHTML = '<div class="webcomic-container" id="webcomicContainer"></div>';
            
            const container = document.getElementById('webcomicContainer');
            loadedPages.clear();
            
            // Setup page observer for tracking visible pages
            setupPageObserver();
            
            // Reset current visible page to 1
            currentVisiblePage = 1;
            
            // Load all pages of current comic
            for (let i = 1; i <= totalPages; i++) {
                await loadWebcomicPage(i, container);
            }
            
            // Set up scroll listener for loading next comic
            setupWebcomicScrollListener();
        }

        // Load a single page in webcomic mode
        async function loadWebcomicPage(pageNum, container) {
            if (loadedPages.has(pageNum)) return;
            
            try {
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                const fetchOptions = {
                    credentials: 'include'
                };
                
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/page?filePath=${encodeURIComponent(comicFilePath)}&page=${pageNum}`,
                    fetchOptions
                );

                if (!response.ok) {
                    throw new Error('Failed to load page');
                }

                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = `Page ${pageNum}`;
                img.dataset.page = pageNum;
                container.appendChild(img);
                
                // Observe the image for visibility tracking
                if (pageObserver) {
                    pageObserver.observe(img);
                }
                
                loadedPages.add(pageNum);
            } catch (error) {
                console.error(`Error loading page ${pageNum}:`, error);
            }
        }
        
        // Load a single page in webcomic mode and return the image element
        async function loadWebcomicPageWithReturn(pageNum, container) {
            if (loadedPages.has(pageNum)) return null;
            
            try {
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                const fetchOptions = {
                    credentials: 'include'
                };
                
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/page?filePath=${encodeURIComponent(comicFilePath)}&page=${pageNum}`,
                    fetchOptions
                );

                if (!response.ok) {
                    throw new Error('Failed to load page');
                }

                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = `Page ${pageNum}`;
                img.dataset.page = pageNum;
                container.appendChild(img);
                
                // Observe the image for visibility tracking
                if (pageObserver) {
                    pageObserver.observe(img);
                }
                
                loadedPages.add(pageNum);
                return img;
            } catch (error) {
                console.error(`Error loading page ${pageNum}:`, error);
                return null;
            }
        }

        // Setup Intersection Observer for page tracking
        function setupPageObserver() {
            // Clean up existing observer
            if (pageObserver) {
                pageObserver.disconnect();
            }
            
            // Create new observer with threshold to detect when page is mostly visible
            pageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
                        const pageNum = parseInt(entry.target.dataset.page);
                        if (!isNaN(pageNum) && pageNum !== currentVisiblePage) {
                            currentVisiblePage = pageNum;
                            updatePageInfoInWebcomicMode();
                            // Save progress as user scrolls through pages
                            saveReadingProgress(pageNum);
                        }
                    }
                });
            }, {
                root: document.getElementById('readerContent'),
                threshold: [0, 0.5, 1.0], // Trigger when 0%, 50%, or 100% visible
                rootMargin: '-10% 0px -10% 0px' // Focus on middle 80% of viewport
            });
        }
        
        // Update page info display in webcomic mode
        function updatePageInfoInWebcomicMode() {
            const pageInfo = document.getElementById('pageInfo');
            if (pageInfo && readingMode === 'webcomic') {
                pageInfo.textContent = `Page ${currentVisiblePage} / ${totalPages}`;
            }
        }
        
        // Setup scroll listener for webcomic mode
        function setupWebcomicScrollListener() {
            const content = document.getElementById('readerContent');
            
            content.removeEventListener('scroll', handleWebcomicScroll);
            content.addEventListener('scroll', handleWebcomicScroll);
        }

        // Handle scroll in webcomic mode
        async function handleWebcomicScroll() {
            const content = document.getElementById('readerContent');
            const scrollPosition = content.scrollTop + content.clientHeight;
            const scrollHeight = content.scrollHeight;
            
            // Check if scrolled near bottom (within 200px)
            if (scrollHeight - scrollPosition < 200 && !isLoadingNext && nextComicInfo && nextComicInfo.hasAdjacent) {
                isLoadingNext = true;
                hasScrolledToBottom = true;
                
                // Mark current comic as read before loading next
                if (!hasMarkedAsRead) {
                    await markFileAsRead();
                }
                
                await loadNextComic();
            }
        }

        // Prefetch next comic information
        async function prefetchNextComic() {
            try {
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                const fetchOptions = {
                    credentials: 'include'
                };
                
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/adjacent?filePath=${encodeURIComponent(comicFilePath)}&direction=next`,
                    fetchOptions
                );

                if (response.ok) {
                    nextComicInfo = await response.json();
                }
            } catch (error) {
                console.error('Error prefetching next comic:', error);
            }
        }

        // Load next comic seamlessly
        async function loadNextComic() {
            if (!nextComicInfo || !nextComicInfo.hasAdjacent) {
                const container = document.getElementById('webcomicContainer');
                if (container) {
                    const endMessage = document.createElement('div');
                    endMessage.className = 'loading-indicator';
                    endMessage.textContent = 'End of series';
                    container.appendChild(endMessage);
                }
                return;
            }
            
            try {
                const container = document.getElementById('webcomicContainer');
                
                // Store the name of the comic we're leaving
                const leavingComicName = currentComicName;
                const enteringComicName = nextComicInfo.fileName;
                
                // Add comic transition separator
                const transitionDiv = document.createElement('div');
                transitionDiv.className = 'comic-transition';
                transitionDiv.innerHTML = `
                    <div class="comic-transition-title">End of Comic</div>
                    <div class="comic-transition-info">
                        <div class="comic-transition-leaving">Finished: ${escapeHtml(leavingComicName)}</div>
                        <div class="comic-transition-arrow">↓</div>
                        <div class="comic-transition-entering">Next: ${escapeHtml(enteringComicName)}</div>
                    </div>
                    <div class="comic-transition-subtitle">Scroll down to continue reading</div>
                `;
                container.appendChild(transitionDiv);
                
                // Load next comic info
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                const fetchOptions = {
                    credentials: 'include'
                };
                
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/info?filePath=${encodeURIComponent(nextComicInfo.filePath)}`,
                    fetchOptions
                );

                if (response.ok) {
                    const data = await response.json();
                    
                    // Update current comic info
                    const previousComicPath = comicFilePath;
                    comicFilePath = nextComicInfo.filePath;
                    currentComicName = data.fileName;
                    totalPages = data.pageCount;
                    document.getElementById('comicTitle').textContent = data.fileName;
                    
                    // Reset hasMarkedAsRead for the new comic
                    hasMarkedAsRead = false;
                    
                    // Reset current visible page to 1 for the new comic
                    currentVisiblePage = 1;
                    
                    // Create a marker at the start of the new comic for scrolling
                    const startMarker = document.createElement('div');
                    startMarker.id = 'newComicStartMarker';
                    startMarker.dataset.comicPath = comicFilePath;
                    container.appendChild(startMarker);
                    
                    // Load all pages of next comic
                    const imageElements = [];
                    for (let i = 1; i <= totalPages; i++) {
                        const imgElement = await loadWebcomicPageWithReturn(i, container);
                        if (imgElement) {
                            imageElements.push(imgElement);
                        }
                    }
                    
                    // Scroll to the start marker (beginning of new comic) immediately
                    // This ensures the first image of the next comic is shown
                    const content = document.getElementById('readerContent');
                    const marker = document.getElementById('newComicStartMarker');
                    if (marker && content) {
                        // Scroll to marker position immediately (no smooth scroll)
                        const markerPosition = marker.offsetTop;
                        content.scrollTop = markerPosition;
                        console.log('Scrolled to new comic start at position:', markerPosition);
                        
                        // Update page info to show page 1 of new comic
                        updatePageInfoInWebcomicMode();
                    }
                    
                    // Prefetch the next one
                    await prefetchNextComic();
                    isLoadingNext = false;
                }
            } catch (error) {
                console.error('Error loading next comic:', error);
                isLoadingNext = false;
            }
        }
        
        // Helper function to escape HTML for safe display
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load a specific page
        async function loadPage(pageNum) {
            if (pageNum < 1 || pageNum > totalPages) {
                return;
            }

            currentPage = pageNum;
            updateUI();

            const content = document.getElementById('readerContent');
            content.innerHTML = '<div class="loading">Loading page...</div>';

            try {
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                
                // Prepare fetch options with proper authentication
                const fetchOptions = {
                    credentials: 'include' // Important for Authelia cookies
                };
                
                // Add Authorization header only for JWT authentication
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/page?filePath=${encodeURIComponent(comicFilePath)}&page=${pageNum}`,
                    fetchOptions
                );

                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error('Failed to load page');
                }

                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                content.innerHTML = `<img src="${imageUrl}" class="page-image" alt="Page ${pageNum}">`;
                
                // Save reading progress
                await saveReadingProgress(pageNum);
                
                // Mark as read when reaching last page in manga mode
                if (pageNum === totalPages && !hasMarkedAsRead) {
                    await markFileAsRead();
                }
            } catch (error) {
                console.error('Error loading page:', error);
                showError('Failed to load page: ' + error.message);
            }
        }

        // Update UI elements
        function updateUI() {
            document.getElementById('pageInfo').textContent = `Page ${currentPage} / ${totalPages}`;
            document.getElementById('pageSelect').value = currentPage;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        // Navigation functions
        function previousPage() {
            if (currentPage > 1) {
                loadPage(currentPage - 1);
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                loadPage(currentPage + 1);
            }
        }

        function goToPage(pageNum) {
            loadPage(parseInt(pageNum));
        }

        function goBack() {
            window.location.href = '/';
        }

        // Fullscreen functionality
        function toggleFullscreen() {
            const container = document.getElementById('readerContainer');
            
            if (!document.fullscreenElement) {
                container.requestFullscreen().then(() => {
                    container.classList.add('fullscreen-mode', 'auto-hide');
                    document.getElementById('fullscreenBtn').textContent = 'Exit Fullscreen';
                }).catch(err => {
                    console.error('Error entering fullscreen:', err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    container.classList.remove('fullscreen-mode', 'auto-hide');
                    document.getElementById('fullscreenBtn').textContent = 'Fullscreen';
                });
            }
        }

        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            const container = document.getElementById('readerContainer');
            if (!document.fullscreenElement) {
                container.classList.remove('fullscreen-mode', 'auto-hide');
                document.getElementById('fullscreenBtn').textContent = 'Fullscreen';
            }
        });

        // Help dialog
        function showHelp() {
            document.getElementById('shortcutsHelp').classList.add('show');
        }

        function hideHelp() {
            document.getElementById('shortcutsHelp').classList.remove('show');
        }

        // Show error
        function showError(message) {
            const content = document.getElementById('readerContent');
            content.innerHTML = `<div class="error">${message}</div>`;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Don't handle shortcuts if help is shown
            if (document.getElementById('shortcutsHelp').classList.contains('show')) {
                if (e.key === 'Escape') {
                    hideHelp();
                }
                return;
            }

            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (readingMode === 'manga') {
                        previousPage();
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (readingMode === 'manga') {
                        nextPage();
                    }
                    break;
                case 'Home':
                    if (readingMode === 'manga') {
                        loadPage(1);
                    } else {
                        document.getElementById('readerContent').scrollTop = 0;
                    }
                    break;
                case 'End':
                    if (readingMode === 'manga') {
                        loadPage(totalPages);
                    } else {
                        const content = document.getElementById('readerContent');
                        content.scrollTop = content.scrollHeight;
                    }
                    break;
                case 'm':
                case 'M':
                    toggleReadingMode();
                    break;
                case 'f':
                case 'F':
                    toggleFullscreen();
                    break;
                case '?':
                    showHelp();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        goBack();
                    }
                    break;
            }
        });

        // Mark the current file as read
        async function markFileAsRead() {
            if (hasMarkedAsRead) return;
            
            try {
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                const fetchOptions = {
                    method: 'POST',
                    credentials: 'include'
                };
                
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/mark-read?filePath=${encodeURIComponent(comicFilePath)}`,
                    fetchOptions
                );
                
                if (response.ok) {
                    hasMarkedAsRead = true;
                    console.log('Marked file as read:', comicFilePath);
                } else {
                    console.error('Failed to mark file as read:', response.status);
                }
            } catch (error) {
                console.error('Error marking file as read:', error);
            }
        }

        // Save reading progress
        async function saveReadingProgress(pageNum) {
            try {
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                const fetchOptions = {
                    method: 'POST',
                    credentials: 'include'
                };
                
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/progress?filePath=${encodeURIComponent(comicFilePath)}&page=${pageNum}`,
                    fetchOptions
                );
                
                if (response.ok) {
                    console.log('Saved reading progress:', comicFilePath, 'page', pageNum);
                } else {
                    console.error('Failed to save reading progress:', response.status);
                }
            } catch (error) {
                console.error('Error saving reading progress:', error);
            }
        }

        // Load reading progress
        async function loadReadingProgress() {
            try {
                const isAutheliaAuth = localStorage.getItem('authelia_authenticated') === 'true';
                const fetchOptions = {
                    credentials: 'include'
                };
                
                if (!isAutheliaAuth && token) {
                    fetchOptions.headers = {
                        'Authorization': `Bearer ${token}`
                    };
                }
                
                const response = await fetch(
                    `/api/ComicReader/progress?filePath=${encodeURIComponent(comicFilePath)}`,
                    fetchOptions
                );
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Loaded reading progress:', comicFilePath, 'page', data.currentPage);
                    return data.currentPage;
                } else {
                    console.error('Failed to load reading progress:', response.status);
                    return 1; // Default to page 1
                }
            } catch (error) {
                console.error('Error loading reading progress:', error);
                return 1; // Default to page 1
            }
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initReader);
    </script>
</body>
</html>
