version: '3.8'

services:
  comicmaintainer-dotnet:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
    container_name: comicmaintainer-dotnet
    ports:
      - "5000:5000"
    environment:
      - WATCHED_DIR=/watched_dir
      - DUPLICATE_DIR=/duplicates
      - CONFIG_DIR=/Config
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - MAX_WORKERS=4
      - DB_CACHE_SIZE_MB=64
      - JWT_SECRET=${JWT_SECRET:-ChangeThisToASecureRandomString-MustBeAtLeast32CharactersLong!!}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@comicmaintainer.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5000,https://localhost:5000}
    volumes:
      - ./test_comics:/watched_dir
      - ./duplicates:/duplicates
      - ./config:/Config
    restart: unless-stopped
    networks:
      - comicmaintainer

  # Optional Suwayomi (Tachidesk) sidecar used by the "download missing issues"
  # feature. Enable it under Settings → Suwayomi Downloads and point the base
  # URL at http://suwayomi:4567. Add and track the series in Suwayomi first; the
  # source/extension already bound to that series is used for the downloads.
  # suwayomi:
  #   image: ghcr.io/suwayomi/tachidesk:stable
  #   container_name: suwayomi
  #   ports:
  #     - "4567:4567"
  #   volumes:
  #     - ./suwayomi:/home/suwayomi/.local/share/Tachidesk
  #   restart: unless-stopped
  #   networks:
  #     - comicmaintainer

networks:
  comicmaintainer:
    driver: bridge
