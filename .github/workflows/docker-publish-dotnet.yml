name: Build and Push .NET Docker Image

on:
  # Publish only after the version bump for a merge has finished. Building on the push itself
  # used the merge commit, which still carries the previous version, and the bump commit cannot
  # start a build of its own because it is pushed with GITHUB_TOKEN. The published image was
  # therefore always one version behind the newest release. A workflow_run build checks out the
  # commit the bump tagged as the release, which the bump records in its "release-commit" artifact.
  # It does not take the newest commit on dotnet, which is a later merge if one lands before the
  # bump completes: that merge still carries the release's version without being the release. The
  # build runs whatever the bump's outcome, so a merge whose bump was skipped is still published;
  # with no release recorded, it checks out the newest commit on the default branch (dotnet).
  workflow_run:
    workflows: ["Automatic Version Bump"]
    types: [completed]
    branches:
      - dotnet
  pull_request:
    branches: 
      - dotnet
  # Without a version, republishes the selected branch (run it on dotnet), e.g. after a failed push
  # to Docker Hub. With a version, rebuilds that release from its vX.Y.Z git tag and pushes only the
  # matching version tag, e.g. for a release published before version tags existed.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to rebuild and tag, such as 2.0.399. Leave empty to republish the branch.'
        required: false
        default: ''
        type: string

permissions:
  # Downloads the release record from the version bump run that started the publish.
  actions: read
  contents: read

# Runs that publish :dotnet share one group and queue instead of cancelling each other, because a
# cancelled publish would never push its release's version tag. A group holds at most one waiting
# run and a newer one replaces it, so the newest build is still the last to push :dotnet. When
# several releases land while a publish is running, the ones in between are therefore skipped;
# backfill them with the version input. Every other run gets a group of its own: pull request
# builds, which never push, backfills, which never touch :dotnet, and runs whose job is skipped
# below.
concurrency:
  group: ${{ github.workflow }}-${{ ((github.event_name == 'workflow_dispatch' && inputs.version == '') || github.event.workflow_run.event == 'push') && 'publish' || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-push-dotnet:
    # Only a version bump that ran for a push to this repository may publish. workflow_run also
    # fires when a fork's pull request defines a workflow with the same name on a branch called
    # dotnet, and that run must not start a privileged publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_BASE: iceburn1/comicmaintainer
      # Set only by a manual run that backfills a release. Scripts read it from the environment
      # rather than having it expanded into them, so the input can never run as shell code.
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate requested version
        if: inputs.version != ''
        run: |
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version input must be a release number such as 2.0.399, without a 'v' prefix or a fourth '.0' part."
            exit 1
          fi

      # Matching the record by pattern rather than by name downloads nothing, instead of failing,
      # when the bump recorded no release because it was skipped or failed before tagging. The
      # directory is outside the workspace, which the checkout clears.
      - name: Download release record
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          pattern: release-commit
          path: ${{ runner.temp }}/release-commit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read release record
        id: release
        if: github.event_name == 'workflow_run'
        run: |
          RECORD="$RUNNER_TEMP/release-commit/release-commit.txt"
          if [[ ! -f "$RECORD" ]]; then
            echo "The version bump recorded no release, so the newest commit on dotnet is published."
            exit 0
          fi
          COMMIT=$(< "$RECORD")
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The version bump's release record does not hold a commit hash."
            exit 1
          fi
          echo "Release commit: $COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A backfill builds the release's own source, which the version bump tagged vX.Y.Z, and a
          # publish after a version bump builds the commit the bump released.
          ref: ${{ inputs.version != '' && format('refs/tags/v{0}', inputs.version) || steps.release.outputs.commit || '' }}
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Get version from .NET project
        id: get_version
        run: |
          VERSION=$(grep -m 1 -oP '<Version>\K[^<]+' src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj || true)
          # A missing or malformed version would be published as a meaningless tag.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read an X.Y.Z <Version> from src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj"
            exit 1
          fi
          if [[ -n "$REQUESTED_VERSION" && "$VERSION" != "$REQUESTED_VERSION" ]]; then
            echo "::error::Tag v$REQUESTED_VERSION contains version $VERSION, so it cannot be published as $REQUESTED_VERSION."
            exit 1
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      
      - name: Determine Docker tags and platforms
        id: docker_tags
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          # The commit the version bump released, when the bump that started the publish made one.
          BUMP_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          PLATFORMS="linux/amd64,linux/arm64"
          if [[ -n "$REQUESTED_VERSION" ]]; then
            # A backfill never moves :dotnet, which must stay on the newest release.
            TAGS="${IMAGE_BASE}:${VERSION}"
            # Rebuild a release for the platforms it was published for. Releases before 2.0.288
            # were amd64 only: their Dockerfile can build arm64 only by running the whole .NET SDK
            # under emulation.
            if ! grep -q 'linux/arm64' .github/workflows/docker-publish-dotnet.yml; then
              PLATFORMS="linux/amd64"
            fi
          else
            # Pull request builds get the tag too, but are never pushed.
            TAGS="${IMAGE_BASE}:dotnet"
            if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
              HEAD_COMMIT=$(git rev-parse HEAD)
              # Only the commit the version bump tagged vX.Y.Z is that release. A later commit, such
              # as a merge whose bump was skipped, still carries the previous version number, and
              # tagging it would replace that release's image with different code.
              REFS=$(git ls-remote origin "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}" refs/heads/dotnet)
              # The bump creates an annotated tag, whose commit is listed on the peeled "^{}" line;
              # a lightweight tag points at its commit directly.
              RELEASE_COMMIT=$(awk -v ref="refs/tags/v${VERSION}^{}" '$2 == ref { print $1 }' <<< "$REFS")
              if [[ -z "$RELEASE_COMMIT" ]]; then
                RELEASE_COMMIT=$(awk -v ref="refs/tags/v${VERSION}" '$2 == ref { print $1 }' <<< "$REFS")
              fi
              if [[ "$RELEASE_COMMIT" == "$HEAD_COMMIT" ]]; then
                TAGS="${TAGS}"$'\n'"${IMAGE_BASE}:${VERSION}"
              elif [[ -n "$BUMP_COMMIT" ]]; then
                echo "::error::The version bump released ${BUMP_COMMIT}, but v${VERSION} is not tagged on it."
                exit 1
              else
                echo "::notice::This commit is not the v${VERSION} release, so only :dotnet is published."
              fi
              # Once dotnet has moved past a release, :dotnet is left to the publish of the newer
              # commits, which may already have run, e.g. when this run is a re-run. :dotnet then
              # never goes back to an older build.
              DOTNET_TIP=$(awk '$2 == "refs/heads/dotnet" { print $1 }' <<< "$REFS")
              if [[ -n "$BUMP_COMMIT" && "$DOTNET_TIP" != "$HEAD_COMMIT" ]]; then
                TAGS="${IMAGE_BASE}:${VERSION}"
                echo "::notice::dotnet has moved on since v${VERSION}, so only :${VERSION} is published. The publish of the newer commits moves :dotnet."
              fi
            fi
          fi
          echo "Tags:"
          echo "$TAGS"
          echo "Platforms: $PLATFORMS"
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "platforms=$PLATFORMS"
          } >> "$GITHUB_OUTPUT"
        
      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-dotnet
          key: ${{ runner.os }}-buildx-dotnet-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-dotnet-
      
      # Registers QEMU so the runner can execute arm64 binaries. Required because the final
      # image stage installs system packages with apt-get, which runs under the target
      # architecture; without this the arm64 build fails with "exec format error".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push .NET Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.dotnet
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache-dotnet
          cache-to: type=local,dest=/tmp/.buildx-cache-dotnet
          # linux/amd64 and linux/arm64, except for backfills of releases that predate arm64 images.
          # arm64 covers Apple Silicon and common NAS/SBC hosts. The build stage compiles natively
          # for the runner and cross-targets, so this does not require emulation.
          platforms: ${{ steps.docker_tags.outputs.platforms }}
          
      - name: Image digest
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.docker_tags.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pushed $DIGEST with tags:"
          echo "$TAGS"
          {
            echo "### Published image"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            while IFS= read -r tag; do
              echo "- \`$tag\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
