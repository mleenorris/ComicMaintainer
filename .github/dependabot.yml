# Dependabot keeps dependencies patched without anyone having to watch advisory feeds.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2

updates:
  # NuGet packages. A single entry covers every project in the repository: Dependabot
  # discovers all .csproj files under the given directory.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Only "dependencies" is used: Dependabot creates that label itself, whereas a custom
    # label that does not already exist in the repository is silently not applied.
    labels:
      - dependencies
    # No package is ignored. SharpCompress, which opens every untrusted archive, ships its fixes
    # (security fixes included) in 0.x minor versions, and an ignore rule would also suppress
    # Dependabot's security-update PRs for it. CI decides whether a bump compiles and passes.
    groups:
      # Test-only dependencies carry no production risk, so batching them keeps the review
      # queue focused on packages that ship. Listed before the Microsoft group would match
      # them, since Dependabot assigns each package to the first group it matches.
      test:
        patterns:
          - "xunit*"
          - "Moq"
          - "coverlet*"
          - "Microsoft.NET.Test.Sdk"
          - "YamlDotNet"
      # Microsoft's runtime packages are versioned and released together, so updating them
      # individually produces PRs that conflict with each other and can leave the projects on
      # a mismatched set of versions.
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"

  # GitHub Actions used by the workflows in .github/workflows, the scanners among them (the Trivy,
  # CodeQL and setup actions). Checked daily so a new release is proposed within a day; the group
  # below keeps that to one pull request at a time. Trivy itself is not pinned: the workflows ask
  # for its latest release (version: latest).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  # Base images in the Dockerfiles.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
