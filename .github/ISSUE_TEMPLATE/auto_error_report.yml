name: Automated Error Report
description: Filed by a ComicMaintainer instance when it catches an unhandled error. Not for manual bug reports.
title: "[Auto]: "
labels: ["bug", "auto-reported"]
body:
  - type: markdown
    attributes:
      value: |
        This template is filled in automatically by the error reporter in a
        ComicMaintainer instance. If you are reporting a bug by hand, use
        [Bug Report](?template=bug_report.yml) instead — it asks the questions a
        human can answer.

        Everything below has already been redacted on the reporting instance:
        absolute paths, library and file names, user names, e-mail addresses,
        API keys and tokens are replaced with `[redacted]` before the report
        leaves the machine. Please do not paste raw logs into this issue.

  - type: textarea
    id: report
    attributes:
      label: Error report
      description: The generated, redacted report. Leave it exactly as it is.
      value: |
        <!-- Generated by ComicMaintainer. Do not edit above the divider. -->
      render: markdown
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What were you doing?
      description: >
        Optional, but by far the most useful thing you can add. One or two lines
        about what you were doing when this happened turns a stack trace into a
        reproducible bug.
      placeholder: "Opened a webcomic in the reader and scrolled to the end of the issue."
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I have read the report above and it contains no personal or private information.
          required: true
        - label: I searched for an existing issue with the same fingerprint.
          required: false
