name: .NET Tests

on:
  push:
    branches: [ main, develop, dotnet ]
  pull_request:
    branches: [ main, develop, dotnet ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: npm

    - name: Install JavaScript test dependencies
      run: npm ci

    # node:test unit tests for the web UI scripts (node:vm sandboxes and jsdom
    # page tests), with coverage written to coverage/lcov.info.
    - name: Run JavaScript unit tests with coverage
      run: npm run test:coverage

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies (excluding MAUI)
      run: |
        dotnet restore src/ComicMaintainer.Core/ComicMaintainer.Core.csproj
        dotnet restore src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
        dotnet restore tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj

    - name: Build (excluding MAUI)
      run: |
        dotnet build src/ComicMaintainer.Core/ComicMaintainer.Core.csproj --no-restore --configuration Release
        dotnet build src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj --no-restore --configuration Release
        dotnet build tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj --no-restore --configuration Release

    - name: Run unit tests (Category!=Integration)
      run: >
        dotnet test tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj
        --no-build --configuration Release --verbosity normal
        --filter "Category!=Integration"
        --collect:"XPlat Code Coverage"
        --settings coverlet.runsettings
        --results-directory ./TestResults
        --logger "trx;LogFileName=unit-tests.trx"

    - name: Upload unit test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: unit-test-results
        path: |
          ./TestResults/**/*.trx
          ./TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

    - name: Code Coverage Summary
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: TestResults/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'

    - name: Add Testing Policy Note to Coverage Report
      if: github.event_name == 'pull_request'
      run: |
        sudo chown "$(id -u):$(id -g)" code-coverage-results.md
        echo "" >> code-coverage-results.md
        echo "---" >> code-coverage-results.md
        echo "" >> code-coverage-results.md
        echo "### 📋 Testing Requirements" >> code-coverage-results.md
        echo "" >> code-coverage-results.md
        echo "All code changes must include appropriate tests. See [TESTING_POLICY.md](../blob/${{ github.head_ref || github.ref_name }}/TESTING_POLICY.md) for details." >> code-coverage-results.md
        echo "" >> code-coverage-results.md
        echo "**Minimum Requirements:**" >> code-coverage-results.md
        echo "- ✅ Unit tests for all new/changed code" >> code-coverage-results.md
        echo "- ✅ Integration tests for multi-component features" >> code-coverage-results.md
        echo "- ✅ Target: 80%+ coverage for new code" >> code-coverage-results.md
        echo "- ✅ No significant coverage decrease" >> code-coverage-results.md

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v3
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: github.event_name == 'push'
      with:
        # `files` adds to the reports Codecov discovers; keep discovery to
        # TestResults so the JavaScript LCOV report is not flagged as .NET.
        directory: ./TestResults
        files: ./TestResults/**/coverage.cobertura.xml
        flags: dotnet-unit
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload JavaScript coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: github.event_name == 'push'
      with:
        files: ./coverage/lcov.info
        # Upload only the LCOV report; discovery would also find the .NET reports.
        disable_search: true
        flags: javascript
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Deleting files pins the checked directory with platform-specific handles, so the
  # delete-job tests also run on Windows and macOS, where their own cases apply.
  file-operation-tests:
    name: File Operation Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Build tests (excluding MAUI)
      run: dotnet build tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj --configuration Release

    - name: Run delete-job tests
      run: >
        dotnet test tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj
        --no-build --configuration Release --verbosity normal
        --filter "FullyQualifiedName~ComicProcessorServiceJobCoverageTests.DeleteFilesAsync"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies (excluding MAUI)
      run: |
        dotnet restore src/ComicMaintainer.Core/ComicMaintainer.Core.csproj
        dotnet restore src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
        dotnet restore tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj

    - name: Build (excluding MAUI)
      run: |
        dotnet build src/ComicMaintainer.Core/ComicMaintainer.Core.csproj --no-restore --configuration Release
        dotnet build src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj --no-restore --configuration Release
        dotnet build tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj --no-restore --configuration Release

    - name: Run integration tests (Category=Integration)
      run: >
        dotnet test tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj
        --no-build --configuration Release --verbosity normal
        --filter "Category=Integration"
        --collect:"XPlat Code Coverage"
        --settings coverlet.runsettings
        --results-directory ./TestResults
        --logger "trx;LogFileName=integration-tests.trx"

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-results
        path: |
          ./TestResults/**/*.trx
          ./TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

    - name: Upload integration coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      if: github.event_name == 'push'
      with:
        files: ./TestResults/**/coverage.cobertura.xml
        flags: dotnet-integration
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
