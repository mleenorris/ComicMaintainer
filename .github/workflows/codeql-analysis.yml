name: "CodeQL Advanced Security Scanning"

on:
  push:
    branches: [ master, main, dotnet, python ]
  pull_request:
    branches: [ master, main, dotnet, python ]
  schedule:
    # Run CodeQL analysis weekly on Wednesday at 3:00 AM UTC
    - cron: '0 3 * * 3'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Determine which languages to analyze based on branch
  analyze-dotnet:
    name: CodeQL Analysis (C#/.NET)
    if: github.ref_name == 'dotnet' || github.base_ref == 'dotnet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
        config: |
          paths-ignore:
            - '**/node_modules'
            - '**/wwwroot/lib'
            - '**/bin'
            - '**/obj'
            - '**/coveragereport'
            - '**/*.min.js'
            - '**/*.min.css'

    - name: Setup .NET
      if: matrix.language == 'csharp'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies (excluding MAUI)
      if: matrix.language == 'csharp'
      run: |
        dotnet restore src/ComicMaintainer.Core/ComicMaintainer.Core.csproj
        dotnet restore src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
        dotnet restore tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj

    - name: Build .NET projects (excluding MAUI)
      if: matrix.language == 'csharp'
      run: |
        dotnet build src/ComicMaintainer.Core/ComicMaintainer.Core.csproj --no-restore --configuration Release
        dotnet build src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj --no-restore --configuration Release
        dotnet build tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj --no-restore --configuration Release
      timeout-minutes: 15

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: true
        wait-for-processing: true
      timeout-minutes: 30

    - name: Generate analysis summary
      if: always()
      run: |
        echo "# CodeQL Analysis Summary - ${{ matrix.language }}" > codeql-summary-${{ matrix.language }}.md
        echo "" >> codeql-summary-${{ matrix.language }}.md
        echo "**Analysis Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> codeql-summary-${{ matrix.language }}.md
        echo "**Language:** ${{ matrix.language }}" >> codeql-summary-${{ matrix.language }}.md
        echo "**Branch:** ${{ github.ref_name }}" >> codeql-summary-${{ matrix.language }}.md
        echo "**Query Suite:** security-and-quality (extended)" >> codeql-summary-${{ matrix.language }}.md
        echo "" >> codeql-summary-${{ matrix.language }}.md
        echo "CodeQL analysis completed successfully." >> codeql-summary-${{ matrix.language }}.md

    - name: Upload analysis summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-summary-dotnet-${{ matrix.language }}
        path: codeql-summary-${{ matrix.language }}.md
        retention-days: 90

  analyze-python:
    name: CodeQL Analysis (Python)
    if: github.ref_name == 'master' || github.ref_name == 'python' || github.base_ref == 'master' || github.base_ref == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: +security-and-quality
        config: |
          paths-ignore:
            - '**/node_modules'
            - '**/__pycache__'
            - '**/*.pyc'
            - '**/venv'
            - '**/.venv'
            - '**/*.min.js'
            - '**/*.min.css'

    - name: Setup Python
      if: matrix.language == 'python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      if: matrix.language == 'python'
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: true
        wait-for-processing: true
      timeout-minutes: 30

    - name: Generate analysis summary
      if: always()
      run: |
        echo "# CodeQL Analysis Summary - ${{ matrix.language }}" > codeql-summary-${{ matrix.language }}.md
        echo "" >> codeql-summary-${{ matrix.language }}.md
        echo "**Analysis Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> codeql-summary-${{ matrix.language }}.md
        echo "**Language:** ${{ matrix.language }}" >> codeql-summary-${{ matrix.language }}.md
        echo "**Branch:** ${{ github.ref_name }}" >> codeql-summary-${{ matrix.language }}.md
        echo "**Query Suite:** security-and-quality (extended)" >> codeql-summary-${{ matrix.language }}.md
        echo "" >> codeql-summary-${{ matrix.language }}.md
        echo "CodeQL analysis completed successfully." >> codeql-summary-${{ matrix.language }}.md

    - name: Upload analysis summary
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: codeql-summary-python-${{ matrix.language }}
        path: codeql-summary-${{ matrix.language }}.md
        retention-days: 90
