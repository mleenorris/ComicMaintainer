name: Security Vulnerability Scanning

on:
  push:
    branches: [ dotnet ]
  pull_request:
    branches: [ dotnet ]
  schedule:
    # Run security scans weekly on Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  dependency-scan:
    name: NuGet Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The MAUI project is deliberately excluded: it targets net10.0-android and
      # restoring it requires the maui-android workload, which is not installed here.
      - name: Restore dependencies (excluding MAUI)
        run: |
          dotnet restore src/ComicMaintainer.Core/ComicMaintainer.Core.csproj
          dotnet restore src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
          dotnet restore tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj

      - name: Scan for vulnerable NuGet packages
        id: nuget_audit
        run: |
          set -o pipefail
          : > nuget-audit-report.txt
          for proj in \
            src/ComicMaintainer.Core/ComicMaintainer.Core.csproj \
            src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj \
            tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj
          do
            echo "=== $proj ===" >> nuget-audit-report.txt
            dotnet list "$proj" package --vulnerable --include-transitive \
              >> nuget-audit-report.txt 2>&1 || true
            echo "" >> nuget-audit-report.txt
          done
          cat nuget-audit-report.txt

          # `dotnet list package --vulnerable` always exits 0, so detect findings
          # from the report body instead. Critical/High fail the job; Moderate/Low
          # are reported but tolerated so the scheduled run stays actionable
          # (SharpCompress currently carries a known moderate advisory and is
          # pinned for API-compatibility reasons).
          if grep -qiE '^\s*>\s+\S+.*\b(Critical|High)\b' nuget-audit-report.txt; then
            echo "::error::Critical or High severity NuGet vulnerabilities found"
            echo "status=critical" >> $GITHUB_OUTPUT
            exit 1
          elif grep -qiE '^\s*>\s+\S+.*\b(Moderate|Low)\b' nuget-audit-report.txt; then
            echo "::warning::Moderate or Low severity NuGet vulnerabilities found"
            echo "status=moderate" >> $GITHUB_OUTPUT
          else
            echo "No known vulnerabilities found in NuGet dependencies"
            echo "status=clean" >> $GITHUB_OUTPUT
          fi

      - name: Upload NuGet audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-audit-report
          path: nuget-audit-report.txt
          retention-days: 30

  filesystem-scan:
    name: Source Tree Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy filesystem results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: trivy-filesystem

  docker-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single-architecture (amd64) build: the scan only needs one image to
      # inspect, and skipping the arm64 cross-build keeps the scan fast. No QEMU
      # is required because the runner is already amd64.
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.dotnet
          push: false
          tags: comicmaintainer:scan
          load: true
          platforms: linux/amd64

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'comicmaintainer:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-image

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'comicmaintainer:scan'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-report
          path: trivy-results.txt
          retention-days: 30
