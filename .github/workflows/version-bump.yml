name: Release
# Every push to dotnet is tested, and only a tested commit is released: the version bump, its
# vX.Y.Z tag and GitHub release, the Docker image and the Windows and Android downloads all wait
# for the unit, integration, Windows and container tests of the pushed commit. The builds are
# called as reusable workflows with the release tag, because a tag pushed with GITHUB_TOKEN
# cannot start the tag-triggered workflows itself.

on:
  push:
    branches: [ dotnet ]

# One release at a time, in push order. A newer push waits instead of cancelling a running
# release, and while it waits it replaces any older push still waiting: that push's commits are
# part of the newer one, which is tested and released instead.
concurrency:
  group: release-dotnet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test-dotnet.yml
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  container-tests:
    name: Container tests
    uses: ./.github/workflows/integration-tests-e2e.yml
    permissions:
      contents: read
      security-events: write

  bump-version:
    name: Version bump
    needs: [tests, container-tests]
    # A commit message containing [skip-version-bump] (and the bump commit itself, which carries
    # it) is tested and published as :dotnet, but gets no version.
    if: "!contains(github.event.head_commit.message, '[skip-version-bump]') && !contains(github.event.head_commit.message, 'Bump version to')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      # Empty when nothing was released because dotnet moved past the tested commit.
      version: ${{ steps.push.outputs.released == 'true' && steps.bump.outputs.new_version || '' }}
      commit: ${{ steps.push.outputs.commit }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only the tested commit may be released. If another push landed meanwhile, its own run
      # (waiting in the concurrency group) tests and releases the newer commit, which includes
      # this one, so this run releases nothing.
      - name: Check that the tested commit is still the newest
        id: tip
        run: |
          TIP=$(git ls-remote origin refs/heads/dotnet | cut -f1)
          if [[ "$TIP" != "$GITHUB_SHA" ]]; then
            echo "::notice::dotnet has moved past the tested commit ${GITHUB_SHA} to ${TIP}; the run for the newer push releases both."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        id: bump
        if: steps.tip.outputs.current == 'true'
        run: |
          PROJECT=src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
          CURRENT_VERSION=$(grep -m 1 -oP '(?<=<Version>)[^<]+' "$PROJECT")
          if [[ ! "$CURRENT_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Could not read an X.Y.Z <Version> from $PROJECT"
            exit 1
          fi
          # A version with no tag was set by hand in the project, such as a new major version, so
          # it is released exactly as it stands. Its tag then exists, and the next push increments
          # the patch number again.
          if ! git rev-parse -q --verify "refs/tags/v${CURRENT_VERSION}" > /dev/null; then
            echo "Version: $CURRENT_VERSION has no tag yet, so it is released as it stands"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          echo "Version: $CURRENT_VERSION -> $NEW_VERSION"
          sed -i "s|<Version>.*</Version>|<Version>$NEW_VERSION</Version>|" "$PROJECT"
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>$NEW_VERSION.0</AssemblyVersion>|" "$PROJECT"
          sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>$NEW_VERSION.0</FileVersion>|" "$PROJECT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      # The bump commit and its tag are pushed together: either both land or neither does. The
      # push is rejected if dotnet moved after the check above; that is handled like the check.
      - name: Commit, tag and push
        id: push
        if: steps.tip.outputs.current == 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          BUMPED: ${{ steps.bump.outputs.bumped }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Nothing to commit when the project already holds the version being released.
          if [[ "$BUMPED" == "true" ]]; then
            git add src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
            git commit -m "Bump version to $NEW_VERSION [skip-version-bump]"
          fi
          git tag -a "v${NEW_VERSION}" -m "Release version ${NEW_VERSION}"
          if ! git push --atomic origin "HEAD:refs/heads/dotnet" "refs/tags/v${NEW_VERSION}"; then
            TIP=$(git ls-remote origin refs/heads/dotnet | cut -f1)
            if [[ "$TIP" != "$GITHUB_SHA" ]]; then
              echo "::notice::dotnet moved to ${TIP} while v${NEW_VERSION} was being made; the run for the newer push releases it."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not push the version bump and the v${NEW_VERSION} tag."
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.push.outputs.released == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: Release v${{ steps.bump.outputs.new_version }}
          # The text below, followed by the pull requests merged since the previous release.
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/dotnet/CHANGELOG.md) for the notable changes, and the Docker image `iceburn1/comicmaintainer:${{ steps.bump.outputs.new_version }}`.
          draft: false
          prerelease: false

  # Runs whenever the tests passed, also when no version was released (a [skip-version-bump]
  # push still moves :dotnet). It builds the release commit, or else the tested commit.
  publish-image:
    name: Docker image
    needs: [tests, container-tests, bump-version]
    if: "!cancelled() && needs.tests.result == 'success' && needs.container-tests.result == 'success' && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')"
    uses: ./.github/workflows/docker-publish-dotnet.yml
    permissions:
      contents: read
    with:
      commit: ${{ needs.bump-version.outputs.commit || github.sha }}
      release: ${{ needs.bump-version.outputs.commit != '' }}
    secrets: inherit

  windows-release:
    name: Windows release
    needs: bump-version
    if: needs.bump-version.outputs.version != ''
    uses: ./.github/workflows/build-windows-release.yml
    permissions:
      contents: write
    with:
      tag: v${{ needs.bump-version.outputs.version }}

  android-release:
    name: Android release
    needs: bump-version
    if: needs.bump-version.outputs.version != ''
    uses: ./.github/workflows/build-android-apk.yml
    permissions:
      contents: write
    with:
      tag: v${{ needs.bump-version.outputs.version }}
