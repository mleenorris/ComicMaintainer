name: Security Vulnerability Scanning

on:
  push:
    branches: [ dotnet ]
  pull_request:
    branches: [ dotnet ]
  schedule:
    # Run security scans weekly on Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The MAUI project targets net9.0-android and cannot restore without the Android
      # workload, so the shipped projects are restored individually.
      - name: Restore dependencies (excluding MAUI)
        run: |
          dotnet restore src/ComicMaintainer.Core/ComicMaintainer.Core.csproj
          dotnet restore src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj
          dotnet restore tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj

      # `dotnet list package --vulnerable` exits 0 even when it finds advisories, so the
      # report is captured and inspected rather than relying on the exit code.
      - name: Scan NuGet dependencies for known advisories
        id: scan
        run: |
          set -euo pipefail
          : > vulnerable-packages.txt
          for project in \
            src/ComicMaintainer.Core/ComicMaintainer.Core.csproj \
            src/ComicMaintainer.WebApi/ComicMaintainer.WebApi.csproj \
            tests/ComicMaintainer.Tests/ComicMaintainer.Tests.csproj
          do
            echo "=== $project ===" >> vulnerable-packages.txt
            dotnet list "$project" package --vulnerable --include-transitive \
              >> vulnerable-packages.txt
          done
          cat vulnerable-packages.txt

          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerability-report
          path: vulnerable-packages.txt
          retention-days: 30

      - name: Summarise dependency scan
        if: always()
        run: |
          {
            echo "## NuGet Dependency Scan"
            echo ""
            if [ "${{ steps.scan.outputs.found }}" = "true" ]; then
              echo "Known advisories were found in direct or transitive dependencies."
            else
              echo "No known advisories found in direct or transitive dependencies."
            fi
            echo ""
            echo '```'
            cat vulnerable-packages.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Reported as a warning rather than a build failure. Some advisories reach this
      # project through transitive dependencies that have no patched version published
      # at all — SQLitePCLRaw.lib.e_sqlite3, pulled in by EF Core's SQLite provider, is
      # the current example — so failing here would leave the branch permanently red
      # with no action a contributor could take to clear it. Remediation of the
      # advisories that *are* fixable is driven by Dependabot; this step exists so the
      # current exposure is visible on every run instead of going unnoticed.
      - name: Report advisories
        if: steps.scan.outputs.found == 'true'
        run: |
          echo "::warning::Vulnerable NuGet packages detected. See the job summary for details."

  docker-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dotnet
          push: false
          tags: comicmaintainer:scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'comicmaintainer:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'comicmaintainer:scan'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-results.txt
          retention-days: 30
